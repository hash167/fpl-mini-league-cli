<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e111d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>FPL Live Tracker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e111d;
      --bg-2: #12121b;
      --bg-3: #1a1d2b;
      --line: #2a2f42;
      --text: #e8edf5;
      --muted: #8b93a7;
      --accent: #4cd964;
      --accent-2: #f0c14b;
      --danger: #ff2d55;
      --chip: #3d7eff;
      --card: #ffffff;
      --card-text: #10141c;
      --card-muted: #6b7280;
      --card-ink: #1a2340;
      --rank-up: #4cd964;
      --rank-down: #ff2d55;
      --rank-flat: #8b93a7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body { font: 14px/1.4 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
    header {
      position: sticky; top: 0; z-index: 20;
      background: #0e111dee; backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding: 0.7rem 1rem;
    }
    header .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    h1 { font-size: 1.05rem; margin: 0; letter-spacing: 0.02em; }
    h1 span { color: var(--accent); }
    .pill { font-size: 0.75rem; padding: 0.15rem 0.45rem; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
    .pill.live { color: var(--accent); border-color: #2f6b50; background: #143024; }
    #notifyBtn.on { background: #143024; }
    .loading-msg { color: var(--muted); }
    #notifyBtn.on { border-color: var(--accent); color: var(--accent); }

    #toastHost {
      position: fixed; left: 0.7rem; right: 0.7rem; bottom: 0.9rem;
      z-index: 50; display: flex; flex-direction: column-reverse; gap: 0.4rem;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: var(--card); color: var(--card-text);
      border: 1px solid #d8dbe6;
      border-radius: 12px; padding: 0.7rem 0.85rem;
      box-shadow: 0 10px 28px #00000066;
      animation: toastIn 0.18s ease-out;
    }
    .toast .kicker { font-size: 0.7rem; color: #0f7a2c; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
    .toast .body { font-size: 0.95rem; font-weight: 650; margin-top: 0.12rem; color: var(--card-ink); }
    .toast.hint { background: #f7f8fb; border-color: #d8dbe6; }
    .toast.hint .kicker { color: var(--card-muted); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    main { padding: 0.9rem 1rem 3rem; max-width: 1400px; margin: 0 auto; }
    form.bar { display: flex; gap: 0.45rem; flex-wrap: wrap; align-items: end; }
    label { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.75rem; color: var(--muted); }
    input, button, select {
      font: inherit; color: var(--text); background: var(--bg-2);
      border: 1px solid var(--line); border-radius: 8px; padding: 0.4rem 0.55rem;
    }
    button { cursor: pointer; background: #1a1d2b; }
    button:hover { background: #242838; }
    button.primary { background: #1f4d3a; border-color: #2f6b50; color: var(--accent); }
    .muted { color: var(--muted); }
    .error { color: var(--danger); white-space: pre-wrap; }
    .card {
      background: var(--card); color: var(--card-text);
      border: 1px solid transparent; border-radius: 14px;
      padding: 0.8rem 0.9rem; margin: 0.75rem 0;
      box-shadow: 0 8px 22px #00000055;
    }
    .card .muted { color: var(--card-muted); }
    .card strong { color: var(--card-ink); }
    .card button {
      background: #f3f4f8; color: var(--card-text); border-color: #d8dbe6;
    }
    .card button:hover { background: #e8ebf3; }
    .card button.primary, .card button.active {
      background: #e8fff0; border-color: var(--rank-up); color: #0f7a2c;
    }
    .stats { display: flex; flex-wrap: wrap; gap: 0.7rem 1.1rem; }
    .stat { min-width: 4.5rem; }
    .stat b { display: block; font-size: 1.15rem; }
    .stat span { font-size: 0.72rem; color: var(--card-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat b { color: var(--card-ink); }
    .leagues { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
    .leagues button { font-size: 0.85rem; }
    .leagues button.active {
      background: #e8fff0; border-color: var(--rank-up); color: #0f7a2c;
    }
    .fixtures { display: flex; gap: 0.45rem; overflow-x: auto; padding-bottom: 0.2rem; }
    .fx {
      flex: 0 0 auto; background: #f7f8fb; border: 1px solid #e2e5ef;
      border-radius: 10px; padding: 0.35rem 0.55rem; min-width: 9.4rem; font-size: 0.8rem;
      color: var(--card-text);
    }
    .fx .score { font-weight: 650; color: var(--card-ink); }
    .fx .muted { color: var(--card-muted); }
    .fx.live { border-color: var(--rank-up); box-shadow: 0 0 0 1px #4cd96433; }
    .fx.done { opacity: 0.72; }
    .fx-players { margin-top: 0.28rem; font-size: 0.72rem; line-height: 1.35; }
    .fx-players .role { color: #b45309; font-weight: 650; }
    .fx-players .pts { color: #0f7a2c; font-weight: 650; }
    .toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    table.live { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; color: var(--card-text); }
    table.live th, table.live td { padding: 0.38rem 0.4rem; border-bottom: 1px solid #e6e8f0; text-align: right; white-space: nowrap; }
    table.live th:nth-child(3), table.live td:nth-child(3),
    table.live th.name, table.live td.name { text-align: left; white-space: normal; }
    table.live thead th {
      position: sticky; top: 52px; background: var(--card); cursor: pointer; user-select: none;
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--card-muted);
    }
    table.live tbody tr { cursor: pointer; }
    table.live tbody tr:hover { background: #f3f4f8; }
    table.live tbody tr.selected { background: #e8fff0; }
    .chip { color: var(--chip); font-weight: 650; }
    .note { font-size: 0.8rem; color: #b45309; }
    .card .tag { color: var(--card-muted); }
    .card .scorers { color: var(--card-muted); }
    .card .scorers b { color: #0f7a2c; }
    .split { display: grid; grid-template-columns: 1fr; gap: 0.8rem; }
    @media (min-width: 1100px) { .split.has-detail { grid-template-columns: minmax(0, 1fr) 360px; } }
    .players th, .players td { text-align: left; }
    .players td.num, .players th.num { text-align: right; }
    .tag { font-size: 0.7rem; color: var(--muted); }
    .in { color: var(--accent); }
    .out { color: var(--danger); }
    .bench { opacity: 0.72; }
    .scorers { font-size: 0.75rem; color: var(--muted); white-space: normal; line-height: 1.35; margin-top: 0.2rem; }
    .scorers b { color: var(--accent); font-weight: 650; }
    .scorers .zero { opacity: 0.7; }
    .standings-table-wrap { width: 100%; }
    td.gw-live { font-variant-numeric: tabular-nums; font-weight: 650; }
    td.gw-live .hit { display: block; font-size: 0.68rem; color: var(--danger); font-weight: 650; }

    /* LiveFPL-style mini-league board */
    .league-board {
      background: transparent; border: none; padding: 0; margin: 0.75rem 0;
    }
    .league-toolbar {
      display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center;
      justify-content: space-between;
      background: var(--card); color: var(--card-text);
      border-radius: 14px; padding: 0.55rem 0.7rem;
      box-shadow: 0 6px 20px #0005;
    }
    .league-toolbar .muted { color: var(--card-muted); }
    .league-toolbar button {
      background: #f3f4f8; color: var(--card-text); border-color: #d8dbe6;
    }
    .league-toolbar button:hover { background: #e8ebf3; }
    .league-toolbar button.active {
      background: #e8fff0; border-color: var(--rank-up); color: #0f7a2c;
    }
    .league-title {
      text-align: center; color: #fff; font-weight: 650;
      margin: 0.85rem 0 0.45rem; font-size: 0.98rem; letter-spacing: 0.01em;
    }
    .league-cols {
      display: grid;
      grid-template-columns: 2.6rem minmax(0, 1.6fr) 2.1rem 3.4rem 2.4rem 2.8rem 1rem;
      gap: 0.25rem; align-items: end;
      padding: 0.25rem 0.75rem 0.4rem;
      color: #c5cbe0; font-size: 0.72rem; text-transform: none; font-weight: 600;
    }
    .league-cols span { text-align: center; }
    .league-cols .c-mgr { text-align: left; padding-left: 0.15rem; }
    .league-cards { display: flex; flex-direction: column; gap: 0.55rem; }
    .lf-card {
      background: var(--card); color: var(--card-text);
      border-radius: 15px; padding: 0.55rem 0.65rem 0.6rem;
      box-shadow: 0 8px 22px #00000055;
      cursor: pointer; border: 1px solid transparent;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .lf-card:hover { box-shadow: 0 10px 28px #00000066; }
    .lf-card.selected { border-color: #7dd3a8; box-shadow: 0 0 0 2px #7dd3a855, 0 8px 22px #00000055; }
    .lf-row {
      display: grid;
      grid-template-columns: 2.6rem minmax(0, 1.6fr) 2.1rem 3.4rem 2.4rem 2.8rem 1rem;
      gap: 0.25rem; align-items: center;
    }
    .lf-pos { display: flex; flex-direction: column; align-items: center; gap: 0.12rem; }
    .rank-pill {
      width: 2.15rem; height: 2.15rem; border-radius: 999px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 0.78rem; line-height: 1;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 2px 6px #0003;
    }
    .rank-pill .arr { font-size: 0.62rem; line-height: 0.9; margin-bottom: 0.02rem; }
    .rank-pill.rise { background: var(--rank-up); }
    .rank-pill.drop { background: var(--rank-down); }
    .rank-pill.flat { background: var(--rank-flat); }
    .rank-delta {
      font-size: 0.65rem; color: var(--card-muted); font-variant-numeric: tabular-nums;
      font-weight: 650; min-height: 0.85rem;
    }
    .rank-delta.rise { color: #1a9a3a; }
    .rank-delta.drop { color: var(--rank-down); }
    .lf-mgr { min-width: 0; padding-right: 0.15rem; }
    .lf-mgr .team {
      font-weight: 750; color: var(--card-ink); font-size: 0.92rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lf-mgr .name {
      color: var(--card-muted); font-size: 0.78rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lf-pills { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.28rem; }
    .mini-pill {
      font-size: 0.65rem; padding: 0.12rem 0.4rem; border-radius: 999px;
      border: 1px solid #d5d9e4; color: var(--card-ink); background: #f7f8fb;
      font-weight: 650; white-space: nowrap;
    }
    .mini-pill.chip {
      background: #eef5ff; border-color: #b7d0ff; color: #1d4fb8;
    }
    .lf-yet, .lf-gw, .lf-total {
      text-align: center; font-weight: 750; color: var(--card-ink);
      font-variant-numeric: tabular-nums; font-size: 0.95rem;
    }
    .lf-gw .hit {
      display: block; font-size: 0.62rem; color: var(--rank-down); font-weight: 700;
    }
    .lf-cap {
      text-align: center; min-width: 0;
    }
    .lf-cap .c-name {
      display: block; font-weight: 750; color: var(--card-ink); font-size: 0.78rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lf-cap .vc-name {
      display: block; color: var(--card-muted); font-size: 0.65rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lf-chevron {
      text-align: center; color: #b0b6c8; font-size: 1.1rem; font-weight: 300;
    }
    .lf-card.expanded .lf-chevron { transform: rotate(90deg); }
    .lf-detail {
      display: none; margin-top: 0.55rem; padding-top: 0.5rem;
      border-top: 1px solid #e6e8f0;
    }
    .lf-card.expanded .lf-detail { display: block; }
    .lf-meta { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.45rem; }
    .scorer-pills { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.15rem; }
    .scorer-pill {
      font-size: 0.72rem; padding: 0.18rem 0.45rem; border-radius: 999px;
      background: #f3f4f8; border: 1px solid #d8dbe6; color: var(--card-text);
    }
    .scorer-pill b { color: #0f7a2c; }
    .scorer-pill.zero { color: var(--card-muted); }
    .scorer-pill.hi { background: #e8fff0; border-color: #9ee0b0; }
    .scorer-pill.lo { background: #ffecef; border-color: #ffb3c1; }
    .lf-squad {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr));
      gap: 0.35rem; margin-top: 0.45rem;
    }
    .lf-pl {
      background: #f7f8fb; border: 1px solid #e2e5ef; border-radius: 10px;
      padding: 0.3rem 0.35rem; text-align: center;
    }
    .lf-pl.bench { opacity: 0.72; }
    .lf-pl .pn {
      font-size: 0.68rem; font-weight: 700; color: var(--card-ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lf-pl .pp {
      margin-top: 0.18rem; font-size: 0.78rem; font-weight: 800;
      border-radius: 6px; padding: 0.1rem 0.2rem;
      background: #e8ebf3; color: var(--card-ink);
      font-variant-numeric: tabular-nums;
    }
    .lf-pl .pp.hi { background: #4cd964; color: #fff; }
    .lf-pl .pp.mid { background: #c8f0d0; color: #0f3d1c; }
    .lf-pl .pp.lo { background: #ff2d55; color: #fff; }
    .lf-pl .pp.zero { background: #eceff5; color: var(--card-muted); }
    .lf-pl .tag { font-size: 0.58rem; color: var(--card-muted); }
    table.live-standings { display: none; }
    .mobile-standings { display: none; }

    @media (min-width: 900px) {
      .league-board { max-width: 720px; margin-left: auto; margin-right: auto; }
    }
    .price { color: var(--chip); font-variant-numeric: tabular-nums; }
    .price.up { color: var(--accent); }
    .price.down { color: var(--danger); }

    .board-head { display: flex; flex-wrap: wrap; gap: 0.5rem 0.8rem; align-items: center; justify-content: space-between; }
    .board-head strong { color: var(--card-ink); }
    .chips { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .chips button.active {
      background: #e8fff0; border-color: var(--rank-up); color: #0f7a2c;
    }
    #homeBoard.collapsed #boardMount, #homeBoard.collapsed #boardChips { display: none; }
    #homeBoard.collapsed { padding: 0.55rem 0.75rem; }
    #boardToggle { font-size: 0.85rem; }
    #boardMount { max-height: min(52vh, 420px); overflow: auto; margin-top: 0.5rem; }
    #boardMount table.live thead th { top: 0; background: #f7f8fb; }
    .est { font-size: 0.75rem; font-weight: 650; }
    .est.rise { color: #0f7a2c; }
    .est.fall { color: var(--danger); }
    .est.stable { color: var(--card-muted); }
    .arrow { font-weight: 700; margin-left: 0.25rem; }
    .arrow.up { color: var(--rank-up); }
    .arrow.down { color: var(--rank-down); }
    .arrow.flat { color: var(--rank-flat); }
    .pboard-cards { display: none; }
    .p-card {
      background: #f7f8fb; border: 1px solid #e2e5ef; border-radius: 12px;
      padding: 0.65rem 0.7rem; color: var(--card-text);
      box-shadow: 0 2px 8px #0001;
    }
    .p-card .muted { color: var(--card-muted); }
    .p-card-top { display: flex; justify-content: space-between; gap: 0.5rem; }
    .p-card-top strong { color: var(--card-ink); }
    .p-card-pts { font-size: 1.35rem; color: #0f7a2c; font-weight: 750; }
    table.pboard th, table.pboard td { text-align: left; }
    table.pboard td.num, table.pboard th.num { text-align: right; }
    @media (max-width: 720px) {
      table.pboard { display: none; }
      .pboard-cards { display: flex; flex-direction: column; gap: 0.55rem; }
    }
    @media (max-width: 720px) {
      header { padding: 0.6rem 0.7rem; }
      main { padding: 0.7rem 0.7rem 2.5rem; }
      form.bar { gap: 0.4rem; }
      form.bar label, form.bar input { width: 100%; }
      table.live thead th { top: 48px; }
      .league-cols {
        grid-template-columns: 2.4rem minmax(0, 1.5fr) 1.8rem 3rem 2.2rem 2.5rem 0.85rem;
        padding: 0.2rem 0.55rem 0.35rem; font-size: 0.68rem;
      }
      .lf-row {
        grid-template-columns: 2.4rem minmax(0, 1.5fr) 1.8rem 3rem 2.2rem 2.5rem 0.85rem;
      }
      .lf-card { padding: 0.5rem 0.55rem 0.55rem; border-radius: 14px; }
      .lf-mgr .team { font-size: 0.86rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <h1>FPL <span>Live</span> Tracker</h1>
      <span class="pill" id="gwPill">GW —</span>
      <span class="pill" id="livePill">idle</span>
      <button type="button" id="notifyBtn">Notify off</button>
      <span class="muted" id="refreshHint"></span>
    </div>
  </header>
  <div id="toastHost" aria-live="polite"></div>
  <main>
    <form class="bar" id="search">
      <label>FPL ID <input name="entryId" inputmode="numeric" placeholder="e.g. 1234567" required></label>
      <button class="primary" type="submit">Live rank</button>
      <label>League ID <input name="leagueId" inputmode="numeric" placeholder="optional"></label>
      <button type="button" id="openLeague">Open league</button>
    </form>
    <div id="app"></div>
    <section class="card collapsed" id="homeBoard">
      <div class="board-head">
        <div>
          <strong>Live points + price watch</strong>
          <div class="muted" id="boardNote">Loading player board…</div>
        </div>
        <button type="button" id="boardToggle">Show board</button>
      </div>
      <div class="chips" id="boardChips">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="price">Price rise</button>
      </div>
      <div id="boardMount"></div>
    </section>
  </main>
  <script>
    const app = document.getElementById("app");
    const API_TIMEOUT_MS = 5000;
    const state = {
      entryId: null, gameweek: null, live: false, autosubs: true, detailed: true,
      entry: null, leagues: [], leaguesError: null, leaguesStale: false,
      league: null, picks: null, sort: { key: "liveRank", dir: 1 },
      timer: null, notifyTimer: null,
      notify: false, notifySeen: {}, notifyReady: false,
      board: null, prices: null, boardFilter: "all", boardSort: { key: "livePoints", dir: -1 }, boardOpen: false
    };

    function el(html) {
      const raw = String(html == null ? "" : html).trim();
      const isTr = /^<tr[\s>]/i.test(raw);
      const isCell = /^<t[dh][\s>]/i.test(raw);
      const d = document.createElement("div");
      if (isTr) {
        d.innerHTML = "<table><tbody>" + raw + "</tbody></table>";
        return d.querySelector("tr");
      }
      if (isCell) {
        d.innerHTML = "<table><tbody><tr>" + raw + "</tr></tbody></table>";
        return d.querySelector("td,th");
      }
      d.innerHTML = raw;
      return d.firstElementChild;
    }
    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function fmt(n) { return n == null || n === "" ? "—" : n; }
    function rankArrow(live, official) {
      const L = Number(live), O = Number(official);
      if (!L || !O) return "";
      const d = O - L;
      if (d === 0) return "<span class='arrow flat'>→ 0</span>";
      const places = Math.abs(d).toLocaleString();
      if (d > 0) return "<span class='arrow up'>▲ " + places + "</span>";
      return "<span class='arrow down'>▼ " + places + "</span>";
    }
    function liveOverallHtml(e) {
      if (!e.liveOverallEstimateAvailable || e.liveOverallRankEstimate == null) return "estimate unavailable";
      return fmtRank(e.liveOverallRankEstimate) + " (estimate) " + rankArrow(e.liveOverallRankEstimate, e.startOfGwOverallRank);
    }
    function placeDeltaHtml(team) {
      return rankArrow(team.liveRank, team.lastRank);
    }
    function placeMove(team) {
      const live = Number(team.liveRank), last = Number(team.lastRank);
      if (!live || !last) return { dir: "flat", delta: 0 };
      const d = last - live;
      if (d > 0) return { dir: "rise", delta: d };
      if (d < 0) return { dir: "drop", delta: d };
      return { dir: "flat", delta: 0 };
    }
    function rankPillHtml(team) {
      const move = placeMove(team);
      const arrow = move.dir === "rise" ? "↑" : (move.dir === "drop" ? "↓" : "·");
      const deltaTxt = move.dir === "flat" ? "" : ((move.delta > 0 ? "+" : "") + move.delta);
      return "<div class='lf-pos'>" +
        "<div class='rank-pill " + move.dir + "'><span class='arr'>" + arrow + "</span><span>" + fmt(team.liveRank) + "</span></div>" +
        "<div class='rank-delta " + move.dir + "'>" + deltaTxt + "</div></div>";
    }
    function captainPair(team) {
      const players = team.players || [];
      const cap = players.find((p) => p.captain);
      const vc = players.find((p) => p.viceCaptain);
      return {
        captain: (cap && (cap.webName || cap.name)) || "",
        vice: (vc && (vc.webName || vc.name)) || ""
      };
    }
    function playedCount(team) {
      const starters = (team.players || []).filter((p) => !p.onBench);
      const total = starters.length || 11;
      const rem = Number(team.playersRemaining);
      if (!Number.isFinite(rem)) return null;
      return { played: Math.max(0, total - rem), total: total };
    }

    function fmtMoney(n) { return n == null ? "—" : "£" + Number(n).toFixed(1) + "m"; }
    function fmtRank(n) { return n == null ? "—" : Number(n).toLocaleString(); }
    function fmtAge(seconds) {
      if (seconds == null) return "—";
      const s = Number(seconds);
      if (s < 60) return s + "s ago";
      if (s < 3600) return Math.floor(s / 60) + "m ago";
      return (s / 3600).toFixed(1).replace(/\.0$/, "") + "h ago";
    }
    function fmtEo(eo) {
      if (eo == null || eo === "") return "—";
      return (Number(eo) * 100).toFixed(0) + "%";
    }
    function fmtNowCost(n) {
      if (n == null || n === "") return "";
      return "£" + Number(n).toFixed(1);
    }
    function fmtGwPriceChange(n) {
      if (n == null || n === "" || Number(n) === 0) return "";
      const v = Number(n);
      const sign = v > 0 ? "+" : "−";
      return sign + "£" + Math.abs(v).toFixed(1);
    }
    function priceHtml(pl) {
      const cost = fmtNowCost(pl.nowCost);
      if (!cost) return "";
      const ch = fmtGwPriceChange(pl.costChangeEvent);
      const cls = Number(pl.costChangeEvent) > 0 ? " up" : (Number(pl.costChangeEvent) < 0 ? " down" : "");
      return "<span class='price" + cls + "'>" + cost + (ch ? (" " + ch) : "") + "</span>";
    }
    function pricePlain(pl) {
      const cost = fmtNowCost(pl.nowCost);
      if (!cost) return "";
      const ch = fmtGwPriceChange(pl.costChangeEvent);
      return cost + (ch ? (" " + ch) : "");
    }

    async function api(path) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), API_TIMEOUT_MS);
      try {
        const res = await fetch(path, { signal: ctrl.signal });
        const text = await res.text();
        let data;
        try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }
        if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
        return data;
      } catch (err) {
        if (err && (err.name === "AbortError" || err.name === "TimeoutError")) {
          throw new Error("Official FPL API timed out. Try again in a moment.");
        }
        throw err;
      } finally {
        clearTimeout(timer);
      }
    }

    function setPills(gw, live) {
      document.getElementById("gwPill").textContent = gw ? ("GW " + gw) : "GW —";
      const pill = document.getElementById("livePill");
      pill.textContent = live ? "LIVE" : "not live";
      pill.className = "pill" + (live ? " live" : "");
    }

    function persistView() {
      const params = new URLSearchParams();
      if (state.entryId) params.set("entry", String(state.entryId));
      if (state.league && state.league.leagueId) params.set("league", String(state.league.leagueId));
      const qs = params.toString();
      const next = qs ? (location.pathname + "?" + qs) : location.pathname;
      history.replaceState(null, "", next);
      try {
        if (state.entryId) localStorage.setItem("fpl.entryId", String(state.entryId));
        if (state.league && state.league.leagueId) localStorage.setItem("fpl.leagueId", String(state.league.leagueId));
        else localStorage.removeItem("fpl.leagueId");
      } catch (e) {}
      const entryInput = document.querySelector('input[name="entryId"]');
      const leagueInput = document.querySelector('input[name="leagueId"]');
      if (entryInput && state.entryId) entryInput.value = state.entryId;
      if (leagueInput) leagueInput.value = (state.league && state.league.leagueId) || "";
    }


    function notifySupported() {
      return typeof Notification !== "undefined";
    }
    function notifyGranted() {
      return notifySupported() && Notification.permission === "granted";
    }
    function paintNotifyBtn() {
      const btn = document.getElementById("notifyBtn");
      if (!btn) return;
      const on = !!state.notify;
      btn.textContent = on ? "Notify on" : "Notify off";
      btn.classList.toggle("on", on);
    }
    function showToast(body, hint) {
      const host = document.getElementById("toastHost");
      if (!host) return;
      const node = el("<div class='toast" + (hint ? " hint" : "") + "'><div class='kicker'>" +
        (hint ? "FPL Live" : "Squad tick") + "</div><div class='body'></div></div>");
      node.querySelector(".body").textContent = body;
      host.appendChild(node);
      setTimeout(() => { try { node.remove(); } catch (e) {} }, hint ? 7000 : 5500);
    }
    function primeNotify(players) {
      state.notifySeen = {};
      (players || []).forEach((pl) => {
        const id = pl.element;
        if (id == null) return;
        state.notifySeen[id] = Number(pl.contribution) || 0;
      });
      state.notifyReady = true;
    }
    function maybeNotifySquad(players) {
      if (!state.notify) return;
      const list = players || [];
      if (!state.notifyReady) {
        primeNotify(list);
        return;
      }
      list.forEach((pl) => {
        const id = pl.element;
        if (id == null) return;
        const next = Number(pl.contribution) || 0;
        const prev = state.notifySeen[id];
        state.notifySeen[id] = next;
        if (prev == null || next <= prev) return;
        const name = pl.webName || pl.name || ("Player " + id);
        const tag = pl.captain ? " (C)" : (pl.viceCaptain ? " (VC)" : "");
        const body = name + tag + " " + prev + " → " + next;
        showToast(body, false);
        try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
        if (!notifyGranted()) return;
        try {
          const n = new Notification("FPL Live", {
            body: body,
            tag: "fpl-pts-" + id,
            renotify: true
          });
          n.onclick = () => { try { window.focus(); } catch (e) {} n.close(); };
        } catch (e) {}
      });
    }
    function stopNotifyPoll() {
      if (state.notifyTimer) {
        clearInterval(state.notifyTimer);
        state.notifyTimer = null;
      }
    }
    function startNotifyPoll() {
      stopNotifyPoll();
      if (!(state.notify && state.entryId)) return;
      state.notifyTimer = setInterval(() => {
        if (state.entryId) loadEntry(state.entryId, true);
      }, 30000);
    }
    async function setNotify(on) {
      if (on) {
        if (!state.entryId) {
          alert("Enter your FPL ID first so I only notify for your squad.");
          return;
        }
        if (notifySupported() && Notification.permission !== "granted") {
          try { await Notification.requestPermission(); } catch (e) {}
        }
        state.notify = true;
        state.notifyReady = false;
        try { localStorage.setItem("fpl.notify", "1"); } catch (e) {}
        paintNotifyBtn();
        if (!notifyGranted()) {
          showToast("Alerts will pop on this page. On iPhone: Share → Add to Home Screen for lock-screen banners.", true);
        }
        await loadEntry(state.entryId, true);
        startNotifyPoll();
      } else {
        state.notify = false;
        state.notifyReady = false;
        state.notifySeen = {};
        try { localStorage.setItem("fpl.notify", "0"); } catch (e) {}
        stopNotifyPoll();
        paintNotifyBtn();
      }
    }

    function scheduleRefresh() {
      clearInterval(state.timer);
      const live = !!(state.board && state.board.live) || !!(state.entry && state.entry.live) || !!(state.league && state.league.live);
      document.getElementById("refreshHint").textContent = live ? "auto-refresh 90s" : "fixtures not started";
      if (!live) return;
      state.timer = setInterval(() => {
        loadBoard(true);
        if (state.league) loadLeague(state.league.leagueId, true);
        else if (state.entryId) loadEntry(state.entryId, true);
      }, 90000);
    }

    document.getElementById("search").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const id = Number(fd.get("entryId"));
      if (!id) return;
      await loadEntry(id);
    });
    document.getElementById("openLeague").addEventListener("click", async () => {
      const id = Number(document.querySelector('input[name="leagueId"]').value);
      if (!id) return;
      await loadLeague(id);
    });

    async function loadEntry(entryId, quiet) {
      if (!quiet) app.innerHTML = "<p class='muted'>Loading live rank…</p>";
      try {
        const q = "?autosubs=" + state.autosubs;
        const leaguesP = api("/entries/" + entryId + "/mini-leagues").then((data) => {
          state.leaguesError = data && data.error && data.stale ? data.error : null;
          return data;
        }).catch((leagueErr) => {
          state.leaguesError = leagueErr.message || "Mini-leagues failed to load";
          return { leagues: [], stale: false };
        });
        const [entry, leagues] = await Promise.all([
          api("/entries/" + entryId + "/live" + q),
          leaguesP
        ]);
        state.entryId = entryId;
        state.entry = entry;
        state.leagues = leagues.leagues || [];
        state.leaguesStale = !!leagues.stale;
        if (leagues.stale && leagues.error) state.leaguesError = leagues.error;
        state.gameweek = entry.gameweek;
        state.picks = { players: entry.players, managerName: entry.managerName, teamName: entry.teamName, livePoints: entry.gwGross, gameweek: entry.gameweek };
        setPills(entry.gameweek, entry.live);
        persistView();
        render();
        scheduleRefresh();
        maybeNotifySquad(entry.players);
        startNotifyPoll();
      } catch (err) {
        app.innerHTML = "<p class='error'>" + escapeHtml(err.message) + "</p>";
      }
    }

    async function loadLeague(leagueId, quiet) {
      if (!quiet) app.innerHTML = (app.innerHTML || "") + "<p class='muted'>Loading live table…</p>";
      try {
        const data = await api("/leagues/" + leagueId + "/live?autosubs=" + state.autosubs);
        state.league = data;
        state.gameweek = data.gameweek;
        setPills(data.gameweek, data.live);
        persistView();
        render();
        scheduleRefresh();
      } catch (err) {
        app.innerHTML = "<p class='error'>" + escapeHtml(err.message) + "</p>";
      }
    }

    async function loadPicks(team) {
      try {
        const data = await api("/entries/" + team.entryId + "/event/" + state.gameweek + "/picks?autosubs=" + state.autosubs);
        state.picks = Object.assign({ managerName: team.managerName, entryName: team.entryName }, data);
        render();
      } catch (err) {
        state.picks = { error: err.message };
        render();
      }
    }

    function render() {
      app.innerHTML = "";
      if (state.entry) app.appendChild(renderEntryCard());
      if ((state.leagues && state.leagues.length) || state.leaguesError || state.leaguesStale) app.appendChild(renderLeagues());
      const fixtures = (state.league && state.league.fixtures) || (state.entry && state.entry.fixtures) || [];
      if (fixtures.length) app.appendChild(renderFixtures(fixtures));
      const split = el("<div class='split'></div>");
      if (state.league) {
        split.classList.toggle("has-detail", !!state.picks);
        split.appendChild(renderTable());
      }
      if (state.picks) split.appendChild(renderPicks());
      if (split.children.length) app.appendChild(split);
    }

    function renderEntryCard() {
      const e = state.entry;
      const card = el("<section class='card'></section>");
      card.appendChild(el("<div><strong>" + escapeHtml(e.managerName) + "</strong> · " +
        escapeHtml(e.teamName) + " <span class='muted'>#" + e.entryId + "</span></div>"));
      const stats = el("<div class='stats'></div>");
      const items = [
        ["GW net", e.gwNet],
        ["GW gross", e.gwGross],
        ["Hit", e.transferCost ? ("-" + e.transferCost) : "0"],
        ["Live total", e.liveTotal],
        ["Proj. bonus", e.projectedBonus],
        ["Confirmed bonus", e.confirmedBonus],
        ["Remaining", e.playersRemaining],
        ["Captain", e.captainStatus || "—"],
        ["Chip", e.activeChip || "—"],
        ["Overall rank", fmtRank(e.overallRank) + " (official)"],
        ["Live overall", liveOverallHtml(e)],
        ["Sample age", fmtAge(e.liveOverallSampleAgeSeconds)],
        ["Value", fmtMoney(e.teamValue)],
        ["Bank", fmtMoney(e.bank)],
        ["Free transfers", fmt(e.freeTransfers)],
        ["Autosubs", e.autosubsApplied]
      ];
      items.forEach(([k, v]) => {
        const raw = String(v == null ? "—" : v);
        const safe = raw.indexOf("<span") >= 0 ? raw : escapeHtml(raw);
        stats.appendChild(el("<div class='stat'><span>" + k + "</span><b>" + safe + "</b></div>"));
      });
      card.appendChild(stats);
      return card;
    }

    function renderLeagues() {
      const box = el("<section class='card'><div class='muted'>Mini leagues</div><div class='leagues'></div></section>");
      if (state.leaguesStale) {
        box.appendChild(el("<p class='note'>Showing last-good mini-leagues (official FPL API is slow or down).</p>"));
      }
      if (state.leaguesError && !state.leaguesStale) {
        box.appendChild(el("<p class='error'>" + escapeHtml(state.leaguesError) + "</p>"));
      }
      const row = box.querySelector(".leagues");
      (state.leagues || []).forEach((lg) => {
        const b = el("<button type='button'>" + escapeHtml(lg.name) + " (" + lg.entryCount + ")</button>");
        if (state.league && state.league.leagueId === lg.id) b.classList.add("active");
        b.onclick = () => loadLeague(lg.id);
        row.appendChild(b);
      });
      return box;
    }

    function squadPlayers() {
      return (state.entry && state.entry.players)
        || (state.picks && state.picks.players)
        || [];
    }

    function playersInFixture(fx) {
      const home = String(fx.home || "").toUpperCase();
      const away = String(fx.away || "").toUpperCase();
      return squadPlayers().filter((pl) => {
        const team = String(pl.team || "").toUpperCase();
        return team && (team === home || team === away);
      });
    }

    function renderFixtures(fixtures) {
      const box = el("<section class='card'><div class='muted'>Gameweek fixtures</div><div class='fixtures'></div></section>");
      const row = box.querySelector(".fixtures");
      fixtures.forEach((fx) => {
        const score = fx.started || fx.finished
          ? (fmt(fx.homeScore) + "–" + fmt(fx.awayScore))
          : "vs";
        const clock = fx.finished ? "FT" : (fx.started ? (fx.minutes + "'") : (fx.kickoffTime || "").replace("T", " ").slice(0, 16));
        const node = el("<div class='fx'><div>" + escapeHtml(fx.home) + " <span class='score'>" + score +
          "</span> " + escapeHtml(fx.away) + "</div><div class='muted'>" + escapeHtml(clock) + "</div></div>");
        if (fx.started && !fx.finished) node.classList.add("live");
        if (fx.finished) node.classList.add("done");
        const mine = playersInFixture(fx);
        if (mine.length) {
          const list = el("<div class='fx-players'></div>");
          mine.forEach((pl) => {
            const role = pl.captain ? "C" : (pl.viceCaptain ? "VC" : "");
            const bits = [escapeHtml(pl.webName || pl.name || "")];
            if (role) bits.push("<span class='role'>" + role + "</span>");
            if (pl.onBench) bits.push("<span class='muted'>bench</span>");
            bits.push("<span class='muted'>" + fmt(pl.minutes) + "'</span>");
            bits.push("<span class='pts'>" + fmt(pl.contribution) + " pts</span>");
            const pr = priceHtml(pl);
            if (pr) bits.push(pr);
            list.appendChild(el("<div" + (pl.onBench ? " class='bench'" : "") + ">" + bits.join(" · ") + "</div>"));
          });
          node.appendChild(list);
        }
        row.appendChild(node);
      });
      return box;
    }


    function scorerLine(team) {
      const players = (team.players || []).filter((pl) => !pl.onBench && (pl.contribution > 0 || pl.minutes > 0));
      const scored = players.filter((pl) => pl.contribution > 0)
        .sort((a, b) => (b.contribution - a.contribution));
      if (!scored.length) {
        return "<div class='scorers zero'>No points yet</div>";
      }
      const bits = scored.map((pl) => {
        const tag = pl.captain ? " C" : (pl.viceCaptain ? " VC" : "");
        const pr = pricePlain(pl);
        return escapeHtml(pl.webName || pl.name) + tag + (pr ? (" " + pr) : "") + " <b>" + pl.contribution + "</b>";
      });
      return "<div class='scorers'>" + bits.join(" · ") + "</div>";
    }

    function renderTable() {
      const lg = state.league;
      const wrap = el("<section class='card league-board'></section>");

      const bar = el("<div class='league-toolbar'></div>");
      const left = el("<div><strong>" + escapeHtml(lg.leagueName || ("League " + lg.leagueId)) +
        "</strong> <span class='muted'>· " + (lg.shown || 0) + (lg.entryCount ? ("/" + lg.entryCount) : "") + " teams</span></div>");
      const controls = el("<div style='display:flex;gap:0.35rem;flex-wrap:wrap;align-items:center'></div>");
      const auto = el("<button type='button'>Autosubs " + (state.autosubs ? "On" : "Off") + "</button>");
      auto.classList.toggle("active", !!state.autosubs);
      auto.onclick = () => { state.autosubs = !state.autosubs; if (lg) loadLeague(lg.leagueId); else if (state.entryId) loadEntry(state.entryId); };
      const densCompact = el("<button type='button'>Compact View</button>");
      const densDetail = el("<button type='button'>Detailed View</button>");
      densCompact.classList.toggle("active", !state.detailed);
      densDetail.classList.toggle("active", !!state.detailed);
      densCompact.onclick = () => { state.detailed = false; render(); };
      densDetail.onclick = () => { state.detailed = true; render(); };
      controls.appendChild(auto);
      controls.appendChild(densCompact);
      controls.appendChild(densDetail);
      bar.appendChild(left);
      bar.appendChild(controls);
      wrap.appendChild(bar);

      if (lg.capNote) wrap.appendChild(el("<p class='note'>" + escapeHtml(lg.capNote) + "</p>"));
      if (!lg.live) wrap.appendChild(el("<p class='muted' style='text-align:center'>GW not started yet — showing official FPL totals (live columns will move after kickoff).</p>"));

      const title = (lg.leagueName || ("League " + lg.leagueId)) + " — Live Gameweek " + fmt(lg.gameweek || state.gameweek) + " Table";
      wrap.appendChild(el("<div class='league-title'>" + escapeHtml(title) + "</div>"));
      wrap.appendChild(el("<div class='league-cols'><span>Pos</span><span class='c-mgr'>Manager</span><span>Yet</span><span>(C)</span><span>GW</span><span>Total</span><span></span></div>"));

      const rows = (lg.teams || []).slice().sort((a, b) => {
        const k = state.sort.key;
        const av = a[k], bv = b[k];
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        if (typeof av === "string") return av.localeCompare(bv) * state.sort.dir;
        return (av - bv) * (k === "liveRank" || k === "officialRank" || k === "overallRank" || k === "liveOverallRankEstimate" ? (state.sort.dir === 1 ? 1 : -1) : state.sort.dir);
      });

      const list = el("<div class='league-cards'></div>");
      rows.forEach((team, idx) => {
        const selected = !!(state.picks && state.picks.entryId === team.entryId);
        const expanded = state.detailed && (selected || (!state.picks && idx === 0));
        const caps = captainPair(team);
        const hit = Number(team.transferCost || 0);
        const pills = [];
        if (team.activeChip) pills.push("<span class='mini-pill chip'>" + escapeHtml(team.activeChip) + "</span>");
        if (team.overallRank != null) pills.push("<span class='mini-pill'><b>OR</b> " + fmtRank(team.overallRank) + "</span>");
        const pillRow = pills.length ? ("<div class='lf-pills'>" + pills.join("") + "</div>") : "";

        const card = el(
          "<article class='lf-card" + (selected ? " selected" : "") + (expanded ? " expanded" : "") + "'>" +
            "<div class='lf-row'>" +
              rankPillHtml(team) +
              "<div class='lf-mgr'>" +
                "<div class='team'>" + escapeHtml(team.entryName || "") + "</div>" +
                "<div class='name'>" + escapeHtml(team.managerName || "") + "</div>" +
                pillRow +
              "</div>" +
              "<div class='lf-yet'>" + fmt(team.playersRemaining) + "</div>" +
              "<div class='lf-cap'>" +
                "<span class='c-name'>" + escapeHtml(caps.captain || "—") + "</span>" +
                (caps.vice ? ("<span class='vc-name'>" + escapeHtml(caps.vice) + "</span>") : "") +
              "</div>" +
              "<div class='lf-gw'>" + fmt(team.gwNet) +
                (hit > 0 ? ("<span class='hit'>-" + hit + " hit</span>") : "") +
              "</div>" +
              "<div class='lf-total'>" + fmt(team.liveTotal) + "</div>" +
              "<div class='lf-chevron'>›</div>" +
            "</div>" +
            "<div class='lf-detail'></div>" +
          "</article>"
        );

        const detail = card.querySelector(".lf-detail");
        detail.innerHTML = buildLeagueDetail(team);
        card.onclick = () => {
          if (state.picks && state.picks.entryId === team.entryId && state.detailed) {
            state.detailed = false;
            render();
            return;
          }
          state.detailed = true;
          loadPicks(team);
        };
        list.appendChild(card);
      });
      wrap.appendChild(list);
      return wrap;
    }

    function buildLeagueDetail(team) {
      const meta = [];
      if (team.freeTransfers != null) meta.push("<span class='mini-pill'><b>FT</b> " + fmt(team.freeTransfers) + "</span>");
      if (team.teamValue != null) meta.push("<span class='mini-pill'><b>TV</b> " + fmtMoney(team.teamValue) + "</span>");
      const played = playedCount(team);
      if (played) meta.push("<span class='mini-pill'><b>PLAYED</b> " + played.played + "/" + played.total + "</span>");
      if (team.liveOverallRankEstimate != null) {
        meta.push("<span class='mini-pill'>Live OR " + fmtRank(team.liveOverallRankEstimate) + " est</span>");
      }
      if (Number(team.autosubsApplied) > 0) meta.push("<span class='mini-pill'>Autosubs " + team.autosubsApplied + "</span>");
      const metaHtml = meta.length ? ("<div class='lf-meta'>" + meta.join("") + "</div>") : "";

      const players = team.players || [];
      if (!players.length) {
        return metaHtml + scorerPills(team);
      }
      const xi = players.filter((p) => !p.onBench);
      const bench = players.filter((p) => p.onBench);
      function plCell(pl) {
        const pts = Number(pl.contribution) || 0;
        let cls = "zero";
        if (pts >= 8) cls = "hi";
        else if (pts >= 3) cls = "mid";
        else if (pts > 0) cls = "lo";
        const tag = pl.captain ? "C" : (pl.viceCaptain ? "VC" : "");
        const sub = pl.autoSubIn ? " IN" : (pl.autoSubOut ? " OUT" : "");
        return "<div class='lf-pl" + (pl.onBench ? " bench" : "") + "'>" +
          "<div class='pn'>" + escapeHtml(pl.webName || pl.name || "") + "</div>" +
          (tag || sub ? ("<div class='tag'>" + tag + sub + "</div>") : "") +
          "<div class='pp " + cls + "'>" + pts + "</div></div>";
      }
      return metaHtml +
        "<div class='lf-squad'>" + xi.map(plCell).join("") + "</div>" +
        (bench.length ? ("<div class='muted' style='margin:0.35rem 0 0.15rem;font-size:0.7rem;color:#6b7280'>Bench</div><div class='lf-squad'>" + bench.map(plCell).join("") + "</div>") : "");
    }

    function scorerPills(team) {
      const players = (team.players || []).filter((pl) => !pl.onBench && (pl.contribution > 0 || pl.minutes > 0));
      const scored = players.filter((pl) => pl.contribution > 0)
        .sort((a, b) => (b.contribution - a.contribution));
      if (!scored.length) {
        return "<div class='scorer-pills'><span class='scorer-pill zero'>No points yet</span></div>";
      }
      const pills = scored.map((pl) => {
        const tag = pl.captain ? " C" : (pl.viceCaptain ? " VC" : "");
        const pts = Number(pl.contribution) || 0;
        const cls = pts >= 8 ? " hi" : (pts <= 1 ? " lo" : "");
        const pr = priceHtml(pl);
        return "<span class='scorer-pill" + cls + "'>" + escapeHtml(pl.webName || pl.name) + tag + (pr ? (" " + pr) : "") + " <b>" + pl.contribution + "</b></span>";
      });
      return "<div class='scorer-pills'>" + pills.join("") + "</div>";
    }

    function renderPicks() {
      const p = state.picks;
      const box = el("<section class='card'></section>");
      if (p.error) {
        box.appendChild(el("<p class='error'>" + escapeHtml(p.error) + "</p>"));
        return box;
      }
      box.appendChild(el("<div><strong>" + escapeHtml(p.managerName || "") + "</strong> · " +
        escapeHtml(p.entryName || p.teamName || "") + "</div>"));
      box.appendChild(el("<p class='muted'>GW net " + fmt(p.gwNet) + " · gross " + fmt(p.gwGross) +
        " · hit " + fmt(p.transferCost) + " · live total " + fmt(p.liveTotal) +
        (p.activeChip ? (" · " + p.activeChip) : "") + "</p>"));
      const table = el("<table class='live players'><thead><tr>" +
        "<th></th><th>Player</th><th class='num'>Price</th><th class='num'>Min</th><th class='num'>Raw</th><th class='num'>Bonus</th><th class='num'>×</th><th class='num'>EO</th><th class='num'>Pts</th>" +
        "</tr></thead><tbody></tbody></table>");
      const tbody = table.querySelector("tbody");
      (p.players || []).forEach((pl) => {
        const tag = pl.captain ? " C" : (pl.viceCaptain ? " VC" : "");
        const sub = pl.autoSubIn ? " <span class='in'>IN</span>" : (pl.autoSubOut ? " <span class='out'>OUT</span>" : "");
        const bonus = (pl.confirmedBonus ? pl.confirmedBonus : (pl.projectedBonus ? ("+" + pl.projectedBonus + "p") : "0"));
        const tr = el("<tr class='" + (pl.onBench ? "bench" : "") + "'><td class='tag'>" + pl.elementTypeName +
          "</td><td>" + escapeHtml(pl.webName || pl.name) + (pl.team ? " <span class='muted'>" + escapeHtml(pl.team) + "</span>" : "") +
          tag + sub + "</td><td class='num'>" + (priceHtml(pl) || "—") + "</td><td class='num'>" + pl.minutes + "</td><td class='num'>" + pl.rawPoints +
          "</td><td class='num'>" + bonus + "</td><td class='num'>" + pl.multiplier +
          "</td><td class='num'>" + fmtEo(pl.eo) + "</td><td class='num'>" + pl.contribution + "</td></tr>");
        tbody.appendChild(tr);
      });
      box.appendChild(table);
      return box;
    }

    function fmtNet(n) {
      if (n == null) return "—";
      const v = Number(n);
      if (v > 0) return "+" + v.toLocaleString();
      return v.toLocaleString();
    }
    function officialPrice(p) {
      if (p.nowCost == null) return "—";
      const pounds = (Number(p.nowCost) / 10).toFixed(1);
      const ch = Number(p.costChangeEvent || 0);
      let extra = "";
      if (ch) extra = " " + (ch > 0 ? "+" : "−") + "£" + (Math.abs(ch) / 10).toFixed(1);
      return "£" + pounds + extra;
    }
    function estHtml(p) {
      const lab = p.priceEstimate || "stable";
      const cls = lab === "likely_rise" ? "rise" : (lab === "likely_fall" ? "fall" : "stable");
      const text = lab === "likely_rise" ? "likely rise" : (lab === "likely_fall" ? "likely fall" : "stable");
      return "<span class='est " + cls + "' title='" + escapeHtml(p.priceEstimateReason || "") + "'>" + text + "</span>";
    }
    function applyBoardOpen() {
      const box = document.getElementById("homeBoard");
      const btn = document.getElementById("boardToggle");
      box.classList.toggle("collapsed", !state.boardOpen);
      btn.textContent = state.boardOpen ? "Hide board" : "Show board";
    }
    function estimateRiseRows() {
      return ((state.prices && state.prices.rises) || []).slice();
    }
    function boardRows() {
      const all = (state.board && state.board.players) || [];
      let rows = all.slice();
      if (state.boardFilter === "price") {
        const est = estimateRiseRows().slice();
        est.sort((a, b) => (Number(b.netTransfers) || 0) - (Number(a.netTransfers) || 0));
        return est;
      }
      const { key, dir } = state.boardSort;
      rows.sort((a, b) => {
        const av = a[key], bv = b[key];
        if (typeof av === "string" || typeof bv === "string") {
          return dir * String(av || "").localeCompare(String(bv || ""));
        }
        return dir * ((Number(av) || 0) - (Number(bv) || 0));
      });
      return rows;
    }
    function renderBoard() {
      const mount = document.getElementById("boardMount");
      const note = document.getElementById("boardNote");
      if (!state.board) {
        mount.innerHTML = "";
        return;
      }
      const all = state.board.players || [];
      const movers = estimateRiseRows();
      document.querySelector('#boardChips [data-filter="price"]').textContent = "Price rise (" + movers.length + ")";
      document.querySelector('#boardChips [data-filter="all"]').textContent = "All (" + all.length + ")";
      if (state.boardFilter === "price") {
        const px = state.prices || {};
        const empty = !movers.length;
        if (empty) {
          note.textContent = "No likely rises from current official transfers (estimate before tonight's official change).";
        } else {
          note.textContent = "Estimate before tonight's official change · GW " + (px.gameweek || "—") +
            " · computed " + (px.computedAt || "—") + " · " + movers.length + " likely rises. " +
            (px.estimateNote || "");
        }
      } else {
        note.textContent = (state.board.estimateNote || "") + (state.board.live ? " · GW live" : " · GW not live") + " · " + boardRows().length + " shown";
      }
      const rows = boardRows();
      if (state.boardFilter === "price") {
        const table = el("<table class='live pboard'><thead><tr>" +
          "<th>Player</th><th>Team</th><th class='num'>£price</th><th class='num'>Net xfers</th><th>Estimate</th></tr></thead><tbody></tbody></table>");
        const tb = table.querySelector("tbody");
        rows.forEach((p) => {
          const pounds = p.nowPounds || officialPrice(p);
          tb.appendChild(el("<tr><td>" + escapeHtml(p.webName) + "</td><td>" + escapeHtml(p.team) +
            "</td><td class='num price'>" + escapeHtml(pounds) +
            "</td><td class='num'>" + fmtNet(p.netTransfers) + "</td><td>" + estHtml(p) + "</td></tr>"));
        });
        const cards = el("<div class='pboard-cards'></div>");
        rows.forEach((p) => {
          const pounds = p.nowPounds || officialPrice(p);
          cards.appendChild(el(
            "<article class='p-card'><div class='p-card-top'><div><strong>" + escapeHtml(p.webName) +
            "</strong> <span class='muted'>" + escapeHtml(p.team) +
            "</span></div><div class='p-card-pts'>" + escapeHtml(pounds) +
            "</div></div><div class='muted'>net " + fmtNet(p.netTransfers) + "</div><div>" + estHtml(p) + "</div></article>"
          ));
        });
        mount.innerHTML = "";
        mount.appendChild(table);
        mount.appendChild(cards);
        return;
      }
      const table = el("<table class='live pboard'><thead><tr>" +
        "<th data-k='webName'>Player</th><th data-k='team'>Team</th><th data-k='position'>Pos</th>" +
        "<th class='num' data-k='minutes'>Mins</th><th class='num' data-k='livePoints'>Pts</th>" +
        "<th class='num' data-k='nowCost'>£price</th><th class='num' data-k='netTransfers'>Net xfers</th>" +
        "<th data-k='priceEstimate'>Estimate</th></tr></thead><tbody></tbody></table>");
      table.querySelectorAll("th").forEach((th) => {
        th.onclick = () => {
          const k = th.getAttribute("data-k");
          if (state.boardSort.key === k) state.boardSort.dir *= -1;
          else state.boardSort = { key: k, dir: k === "webName" || k === "team" || k === "position" || k === "priceEstimate" ? 1 : -1 };
          renderBoard();
        };
      });
      const tb = table.querySelector("tbody");
      rows.forEach((p) => {
        tb.appendChild(el("<tr><td>" + escapeHtml(p.webName) + "</td><td>" + escapeHtml(p.team) +
          "</td><td>" + escapeHtml(p.position) + "</td><td class='num'>" + fmt(p.minutes) +
          "</td><td class='num'>" + fmt(p.livePoints) + "</td><td class='num price'>" + officialPrice(p) +
          "</td><td class='num'>" + fmtNet(p.netTransfers) + "</td><td>" + estHtml(p) + "</td></tr>"));
      });
      const cards = el("<div class='pboard-cards'></div>");
      rows.forEach((p) => {
        cards.appendChild(el(
          "<article class='p-card'><div class='p-card-top'><div><strong>" + escapeHtml(p.webName) +
          "</strong> <span class='muted'>" + escapeHtml(p.team) + " · " + escapeHtml(p.position) +
          "</span></div><div class='p-card-pts'>" + fmt(p.livePoints) + "</div></div>" +
          "<div class='muted'>" + fmt(p.minutes) + "' · " + officialPrice(p) + " · net " + fmtNet(p.netTransfers) +
          "</div><div>" + estHtml(p) + "</div></article>"
        ));
      });
      mount.innerHTML = "";
      mount.appendChild(table);
      mount.appendChild(cards);
    }
    async function loadPrices(quiet) {
      try {
        const data = await api("/live/prices/estimate");
        state.prices = data;
        if (state.boardFilter === "price") renderBoard();
      } catch (err) {
        if (!quiet) document.getElementById("boardNote").textContent = err.message;
      }
    }
    async function loadBoard(quiet) {
      try {
        const data = await api("/live/board");
        state.board = data;
        state.gameweek = data.gameweek;
        setPills(data.gameweek, !!(data.live || (state.entry && state.entry.live) || (state.league && state.league.live)));
        await loadPrices(true);
        renderBoard();
        scheduleRefresh();
      } catch (err) {
        if (!quiet) document.getElementById("boardNote").textContent = err.message;
      }
    }
    document.getElementById("boardChips").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-filter]");
      if (!btn) return;
      state.boardFilter = btn.getAttribute("data-filter");
      if (state.boardFilter === "price") {
        state.boardSort = { key: "netTransfers", dir: -1 };
        loadPrices();
      } else state.boardSort = { key: "livePoints", dir: -1 };
      document.querySelectorAll("#boardChips button").forEach((b) => b.classList.toggle("active", b === btn));
      renderBoard();
    });
    document.getElementById("boardToggle").addEventListener("click", () => {
      state.boardOpen = !state.boardOpen;
      try { localStorage.setItem("fpl.boardOpen", state.boardOpen ? "1" : "0"); } catch (e) {}
      applyBoardOpen();
    });

    document.getElementById("notifyBtn").addEventListener("click", () => {
      setNotify(!state.notify);
    });

    (async function boot() {
      try { state.boardOpen = localStorage.getItem("fpl.boardOpen") === "1"; } catch (e) {}
      applyBoardOpen();
      try { state.notify = localStorage.getItem("fpl.notify") === "1"; } catch (e) {}
      paintNotifyBtn();
      const params = new URLSearchParams(location.search);
      let entryId = Number(params.get("entry") || params.get("entryId") || 0);
      let leagueId = Number(params.get("league") || params.get("leagueId") || 0);
      try {
        if (!entryId) entryId = Number(localStorage.getItem("fpl.entryId") || 0);
        if (!leagueId) leagueId = Number(localStorage.getItem("fpl.leagueId") || 0);
      } catch (e) {}
      if (entryId) document.querySelector('input[name="entryId"]').value = entryId;
      if (leagueId) document.querySelector('input[name="leagueId"]').value = leagueId;
      await Promise.all([
        loadBoard(),
        entryId ? loadEntry(entryId) : Promise.resolve()
      ]);
      if (leagueId) await loadLeague(leagueId);
      if (state.notify && state.entryId) startNotifyPoll();
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      }
    })();
  </script>
</body>
</html>
