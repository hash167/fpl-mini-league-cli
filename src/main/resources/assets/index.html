<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FPL Live Tracker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10141c;
      --bg-2: #171d28;
      --bg-3: #1f2734;
      --line: #2b3545;
      --text: #e8edf5;
      --muted: #93a0b5;
      --accent: #7dd3a8;
      --accent-2: #f0c14b;
      --danger: #f07178;
      --chip: #6cb6ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body { font: 14px/1.4 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
    header {
      position: sticky; top: 0; z-index: 20;
      background: #0c1017ee; backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: 0.7rem 1rem;
    }
    header .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    h1 { font-size: 1.05rem; margin: 0; letter-spacing: 0.02em; }
    h1 span { color: var(--accent); }
    .pill { font-size: 0.75rem; padding: 0.15rem 0.45rem; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
    .pill.live { color: var(--accent); border-color: #2f6b50; }
    main { padding: 0.9rem 1rem 3rem; max-width: 1400px; margin: 0 auto; }
    form.bar { display: flex; gap: 0.45rem; flex-wrap: wrap; align-items: end; }
    label { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.75rem; color: var(--muted); }
    input, button, select {
      font: inherit; color: var(--text); background: var(--bg-2);
      border: 1px solid var(--line); border-radius: 6px; padding: 0.4rem 0.55rem;
    }
    button { cursor: pointer; background: #243246; }
    button:hover { background: #2d3e56; }
    button.primary { background: #1f4d3a; border-color: #2f6b50; color: var(--accent); }
    .muted { color: var(--muted); }
    .error { color: var(--danger); white-space: pre-wrap; }
    .card {
      background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px;
      padding: 0.8rem 0.9rem; margin: 0.75rem 0;
    }
    .stats { display: flex; flex-wrap: wrap; gap: 0.7rem 1.1rem; }
    .stat { min-width: 4.5rem; }
    .stat b { display: block; font-size: 1.15rem; }
    .stat span { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .leagues { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
    .leagues button { font-size: 0.85rem; }
    .leagues button.active { border-color: var(--accent); color: var(--accent); }
    .fixtures { display: flex; gap: 0.45rem; overflow-x: auto; padding-bottom: 0.2rem; }
    .fx {
      flex: 0 0 auto; background: var(--bg-3); border: 1px solid var(--line);
      border-radius: 8px; padding: 0.35rem 0.55rem; min-width: 7.8rem; font-size: 0.8rem;
    }
    .fx .score { font-weight: 650; }
    .fx.live { border-color: #2f6b50; }
    .fx.done { opacity: 0.7; }
    .toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    table.live { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    table.live th, table.live td { padding: 0.38rem 0.4rem; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
    table.live th:nth-child(3), table.live td:nth-child(3),
    table.live th.name, table.live td.name { text-align: left; white-space: normal; }
    table.live thead th {
      position: sticky; top: 52px; background: var(--bg-2); cursor: pointer; user-select: none;
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
    }
    table.live tbody tr { cursor: pointer; }
    table.live tbody tr:hover { background: #223044; }
    table.live tbody tr.selected { background: #243b2f; }
    .chip { color: var(--chip); font-weight: 650; }
    .note { font-size: 0.8rem; color: var(--accent-2); }
    .split { display: grid; grid-template-columns: 1fr; gap: 0.8rem; }
    @media (min-width: 1100px) { .split.has-detail { grid-template-columns: minmax(0, 1fr) 360px; } }
    .players th, .players td { text-align: left; }
    .players td.num, .players th.num { text-align: right; }
    .tag { font-size: 0.7rem; color: var(--muted); }
    .in { color: var(--accent); }
    .out { color: var(--danger); }
    .bench { opacity: 0.72; }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <h1>FPL <span>Live</span> Tracker</h1>
      <span class="pill" id="gwPill">GW —</span>
      <span class="pill" id="livePill">idle</span>
      <span class="muted" id="refreshHint"></span>
    </div>
  </header>
  <main>
    <form class="bar" id="search">
      <label>FPL ID <input name="entryId" inputmode="numeric" placeholder="e.g. 1234567" required></label>
      <button class="primary" type="submit">Live rank</button>
      <label>League ID <input name="leagueId" inputmode="numeric" placeholder="optional"></label>
      <button type="button" id="openLeague">Open league</button>
    </form>
    <div id="app"></div>
  </main>
  <script>
    const app = document.getElementById("app");
    const state = {
      entryId: null, gameweek: null, live: false, autosubs: true, detailed: true,
      entry: null, leagues: [], league: null, picks: null, sort: { key: "liveRank", dir: 1 },
      timer: null
    };

    function el(html) {
      const d = document.createElement("div");
      d.innerHTML = html.trim();
      return d.firstElementChild;
    }
    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function fmt(n) { return n == null || n === "" ? "\u2014" : n; }
    function fmtMoney(n) { return n == null ? "\u2014" : "\u00a3" + Number(n).toFixed(1) + "m"; }
    function fmtRank(n) { return n == null ? "\u2014" : Number(n).toLocaleString(); }

    async function api(path) {
      const res = await fetch(path);
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      return data;
    }

    function setPills(gw, live) {
      document.getElementById("gwPill").textContent = gw ? ("GW " + gw) : "GW \u2014";
      const pill = document.getElementById("livePill");
      pill.textContent = live ? "LIVE" : "not live";
      pill.className = "pill" + (live ? " live" : "");
    }

    function scheduleRefresh() {
      clearInterval(state.timer);
      const live = !!(state.entry && state.entry.live) || !!(state.league && state.league.live);
      document.getElementById("refreshHint").textContent = live ? "auto-refresh 90s" : "fixtures not started";
      if (!live) return;
      state.timer = setInterval(() => {
        if (state.league) loadLeague(state.league.leagueId, true);
        else if (state.entryId) loadEntry(state.entryId, true);
      }, 90000);
    }

    document.getElementById("search").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const id = Number(fd.get("entryId"));
      if (!id) return;
      await loadEntry(id);
    });
    document.getElementById("openLeague").addEventListener("click", async () => {
      const id = Number(document.querySelector('input[name="leagueId"]').value);
      if (!id) return;
      await loadLeague(id);
    });

    async function loadEntry(entryId, quiet) {
      if (!quiet) app.innerHTML = "<p class='muted'>Loading live rank\u2026</p>";
      try {
        const q = "?autosubs=" + state.autosubs;
        const entry = await api("/entries/" + entryId + "/live" + q);
        let leagues = { leagues: [] };
        try {
          leagues = await api("/entries/" + entryId + "/mini-leagues");
        } catch (leagueErr) {
          console.warn("mini-leagues failed", leagueErr);
        }
        state.entryId = entryId;
        state.entry = entry;
        state.leagues = leagues.leagues || [];
        state.gameweek = entry.gameweek;
        state.picks = { players: entry.players, managerName: entry.managerName, teamName: entry.teamName, livePoints: entry.gwGross, gameweek: entry.gameweek };
        setPills(entry.gameweek, entry.live);
        render();
        scheduleRefresh();
      } catch (err) {
        app.innerHTML = "<p class='error'>" + escapeHtml(err.message) + "</p>";
      }
    }

    async function loadLeague(leagueId, quiet) {
      if (!quiet) app.innerHTML = (app.innerHTML || "") + "<p class='muted'>Loading live table\u2026</p>";
      try {
        const data = await api("/leagues/" + leagueId + "/live?autosubs=" + state.autosubs);
        state.league = data;
        state.gameweek = data.gameweek;
        setPills(data.gameweek, data.live);
        render();
        scheduleRefresh();
      } catch (err) {
        app.innerHTML = "<p class='error'>" + escapeHtml(err.message) + "</p>";
      }
    }

    async function loadPicks(team) {
      try {
        const data = await api("/entries/" + team.entryId + "/event/" + state.gameweek + "/picks?autosubs=" + state.autosubs);
        state.picks = Object.assign({ managerName: team.managerName, entryName: team.entryName }, data);
        render();
      } catch (err) {
        state.picks = { error: err.message };
        render();
      }
    }

    function render() {
      app.innerHTML = "";
      if (state.entry) app.appendChild(renderEntryCard());
      if (state.leagues && state.leagues.length) app.appendChild(renderLeagues());
      const fixtures = (state.league && state.league.fixtures) || (state.entry && state.entry.fixtures) || [];
      if (fixtures.length) app.appendChild(renderFixtures(fixtures));
      const split = el("<div class='split'></div>");
      if (state.league) {
        split.classList.toggle("has-detail", !!state.picks);
        split.appendChild(renderTable());
      }
      if (state.picks) split.appendChild(renderPicks());
      if (split.children.length) app.appendChild(split);
    }

    function renderEntryCard() {
      const e = state.entry;
      const card = el("<section class='card'></section>");
      card.appendChild(el("<div><strong>" + escapeHtml(e.managerName) + "</strong> \u00b7 " +
        escapeHtml(e.teamName) + " <span class='muted'>#" + e.entryId + "</span></div>"));
      const stats = el("<div class='stats'></div>");
      const items = [
        ["GW net", e.gwNet],
        ["GW gross", e.gwGross],
        ["Hit", e.transferCost ? ("-" + e.transferCost) : "0"],
        ["Live total", e.liveTotal],
        ["Proj. bonus", e.projectedBonus],
        ["Confirmed bonus", e.confirmedBonus],
        ["Remaining", e.playersRemaining],
        ["Captain", e.captainStatus || "\u2014"],
        ["Chip", e.activeChip || "\u2014"],
        ["Overall rank", fmtRank(e.overallRank) + " (official)"],
        ["Value", fmtMoney(e.teamValue)],
        ["Bank", fmtMoney(e.bank)],
        ["Free transfers", fmt(e.freeTransfers)],
        ["Autosubs", e.autosubsApplied]
      ];
      items.forEach(([k, v]) => {
        stats.appendChild(el("<div class='stat'><span>" + k + "</span><b>" + escapeHtml(v) + "</b></div>"));
      });
      card.appendChild(stats);
      return card;
    }

    function renderLeagues() {
      const box = el("<section class='card'><div class='muted'>Mini leagues</div><div class='leagues'></div></section>");
      const row = box.querySelector(".leagues");
      state.leagues.forEach((lg) => {
        const b = el("<button type='button'>" + escapeHtml(lg.name) + " (" + lg.entryCount + ")</button>");
        if (state.league && state.league.leagueId === lg.id) b.classList.add("active");
        b.onclick = () => loadLeague(lg.id);
        row.appendChild(b);
      });
      return box;
    }

    function renderFixtures(fixtures) {
      const box = el("<section class='card'><div class='muted'>Gameweek fixtures</div><div class='fixtures'></div></section>");
      const row = box.querySelector(".fixtures");
      fixtures.forEach((fx) => {
        const score = fx.started || fx.finished
          ? (fmt(fx.homeScore) + "\u2013" + fmt(fx.awayScore))
          : "vs";
        const clock = fx.finished ? "FT" : (fx.started ? (fx.minutes + "'") : (fx.kickoffTime || "").replace("T", " ").slice(0, 16));
        const node = el("<div class='fx'><div>" + escapeHtml(fx.home) + " <span class='score'>" + score +
          "</span> " + escapeHtml(fx.away) + "</div><div class='muted'>" + escapeHtml(clock) + "</div></div>");
        if (fx.started && !fx.finished) node.classList.add("live");
        if (fx.finished) node.classList.add("done");
        row.appendChild(node);
      });
      return box;
    }

    function renderTable() {
      const lg = state.league;
      const wrap = el("<section class='card'></section>");
      const bar = el("<div class='toolbar'></div>");
      bar.appendChild(el("<div><strong>" + escapeHtml(lg.leagueName || ("League " + lg.leagueId)) +
        "</strong> <span class='muted'>\u00b7 " + (lg.shown || 0) + (lg.entryCount ? ("/" + lg.entryCount) : "") + " teams</span></div>"));
      const controls = el("<div></div>");
      const auto = el("<button type='button'>Autosubs " + (state.autosubs ? "On" : "Off") + "</button>");
      auto.onclick = () => { state.autosubs = !state.autosubs; if (lg) loadLeague(lg.leagueId); else if (state.entryId) loadEntry(state.entryId); };
      const dens = el("<button type='button'>" + (state.detailed ? "Detailed" : "Compact") + "</button>");
      dens.onclick = () => { state.detailed = !state.detailed; render(); };
      controls.appendChild(auto);
      controls.appendChild(dens);
      bar.appendChild(controls);
      wrap.appendChild(bar);
      if (lg.capNote) wrap.appendChild(el("<p class='note'>" + escapeHtml(lg.capNote) + "</p>"));
      if (!lg.live) wrap.appendChild(el("<p class='muted'>GW not started yet \u2014 showing official FPL totals (live columns will move after kickoff).</p>"));

      const cols = [
        ["liveRank", "Live rank"],
        ["officialRank", "Official rank"],
        ["managerName", "Manager / team"],
        ["liveTotal", "Live total"],
        ["gwNet", "GW net"],
        ["gwGross", "GW gross", true],
        ["playersRemaining", "Remaining"],
        ["overallRank", "Overall rank", true],
        ["freeTransfers", "FT", true],
        ["teamValue", "Value", true],
        ["activeChip", "Chip", true]
      ].filter((c) => state.detailed || !c[2]);

      const table = el("<table class='live'><thead><tr></tr></thead><tbody></tbody></table>");
      const trh = table.querySelector("thead tr");
      cols.forEach((c) => {
        const th = document.createElement("th");
        th.textContent = c[1] + (state.sort.key === c[0] ? (state.sort.dir === 1 ? " \u2191" : " \u2193") : "");
        if (c[0] === "managerName") th.className = "name";
        th.onclick = () => {
          if (state.sort.key === c[0]) state.sort.dir *= -1;
          else { state.sort.key = c[0]; state.sort.dir = c[0] === "managerName" ? 1 : -1; }
          render();
        };
        trh.appendChild(th);
      });
      const tbody = table.querySelector("tbody");
      const rows = (lg.teams || []).slice().sort((a, b) => {
        const k = state.sort.key;
        const av = a[k], bv = b[k];
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        if (typeof av === "string") return av.localeCompare(bv) * state.sort.dir;
        return (av - bv) * (k === "liveRank" || k === "officialRank" || k === "overallRank" ? (state.sort.dir === 1 ? 1 : -1) : state.sort.dir);
      });
      rows.forEach((team) => {
        const tr = document.createElement("tr");
        if (state.picks && state.picks.entryId === team.entryId) tr.classList.add("selected");
        cols.forEach((c) => {
          const td = document.createElement("td");
          let v = team[c[0]];
          if (c[0] === "managerName") {
            td.className = "name";
            td.innerHTML = "<div>" + escapeHtml(team.managerName) + "</div><div class='muted'>" + escapeHtml(team.entryName) + "</div>";
          } else if (c[0] === "teamValue") td.textContent = fmtMoney(v);
          else if (c[0] === "overallRank") td.textContent = fmtRank(v);
          else if (c[0] === "activeChip") { td.textContent = v || ""; td.className = "chip"; }
          else if (c[0] === "freeTransfers") td.textContent = fmt(v);
          else td.textContent = fmt(v);
          tr.appendChild(td);
        });
        tr.onclick = () => loadPicks(team);
        tbody.appendChild(tr);
      });
      wrap.appendChild(table);
      return wrap;
    }

    function renderPicks() {
      const p = state.picks;
      const box = el("<section class='card'></section>");
      if (p.error) {
        box.appendChild(el("<p class='error'>" + escapeHtml(p.error) + "</p>"));
        return box;
      }
      box.appendChild(el("<div><strong>" + escapeHtml(p.managerName || "") + "</strong> \u00b7 " +
        escapeHtml(p.entryName || p.teamName || "") + "</div>"));
      box.appendChild(el("<p class='muted'>GW net " + fmt(p.gwNet) + " \u00b7 gross " + fmt(p.gwGross) +
        " \u00b7 hit " + fmt(p.transferCost) + " \u00b7 live total " + fmt(p.liveTotal) +
        (p.activeChip ? (" \u00b7 " + p.activeChip) : "") + "</p>"));
      const table = el("<table class='live players'><thead><tr>" +
        "<th></th><th>Player</th><th class='num'>Min</th><th class='num'>Raw</th><th class='num'>Bonus</th><th class='num'>\u00d7</th><th class='num'>Pts</th>" +
        "</tr></thead><tbody></tbody></table>");
      const tbody = table.querySelector("tbody");
      (p.players || []).forEach((pl) => {
        const tag = pl.captain ? " C" : (pl.viceCaptain ? " VC" : "");
        const sub = pl.autoSubIn ? " <span class='in'>IN</span>" : (pl.autoSubOut ? " <span class='out'>OUT</span>" : "");
        const bonus = (pl.confirmedBonus ? pl.confirmedBonus : (pl.projectedBonus ? ("+" + pl.projectedBonus + "p") : "0"));
        const tr = el("<tr class='" + (pl.onBench ? "bench" : "") + "'><td class='tag'>" + pl.elementTypeName +
          "</td><td>" + escapeHtml(pl.webName || pl.name) + (pl.team ? " <span class='muted'>" + escapeHtml(pl.team) + "</span>" : "") +
          tag + sub + "</td><td class='num'>" + pl.minutes + "</td><td class='num'>" + pl.rawPoints +
          "</td><td class='num'>" + bonus + "</td><td class='num'>" + pl.multiplier +
          "</td><td class='num'>" + pl.contribution + "</td></tr>");
        tbody.appendChild(tr);
      });
      box.appendChild(table);
      return box;
    }
  </script>
</body>
</html>
