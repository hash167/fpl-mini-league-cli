<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>FPL Live Tracker</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fb;
      --bg-2: #ffffff;
      --bg-3: #eef2f7;
      --line: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #059669;
      --accent-bright: #10b981;
      --accent-2: #d97706;
      --danger: #e11d48;
      --chip: #2563eb;
      --card: #ffffff;
      --card-text: #0f172a;
      --card-muted: #64748b;
      --card-ink: #0f172a;
      --rank-up: #059669;
      --rank-down: #e11d48;
      --rank-flat: #94a3b8;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow-x: hidden; max-width: 100%; }
    body { font: 14px/1.4 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding: 0.7rem 1rem;
    }
    header .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    header { padding: 0.55rem 1rem; }
    .appbar { display: flex; align-items: center; gap: 0.5rem; max-width: 1400px; margin: 0 auto; min-width: 0; }
    .appbar h1 { font-size: 1.02rem; font-weight: 750; white-space: nowrap; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 0.35rem; flex: none;
      font-size: 0.72rem; font-weight: 650; padding: 0.2rem 0.55rem; border-radius: 999px;
      border: 1px solid var(--line); background: var(--bg-3); color: #526174;
      font-variant-numeric: tabular-nums;
    }
    .status-pill #livePill::before { content: "·"; margin-right: 0.3rem; color: var(--rank-flat); }
    .status-pill .sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--rank-flat); display: inline-block; }
    .status-pill.live { color: #047857; border-color: #a7f3d0; background: #ecfdf5; }
    .status-pill.live .sdot { background: var(--accent-bright, #10b981); animation: sdotPulse 1.6s ease-out infinite; }
    @keyframes sdotPulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55); } 70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
    .updated { margin-left: auto; font-size: 0.7rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn {
      flex: none; width: 44px; height: 44px; padding: 0; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center; color: var(--muted);
    }
    .icon-btn svg { width: 18px; height: 18px; }
    #notifyBtn.icon-btn.on { color: var(--accent); background: #ecfdf5; border-color: #a7f3d0; }
    .ids { margin: 0 0 0.2rem; }
    .ids-summary { display: none; align-items: center; justify-content: space-between; gap: 0.5rem; font-size: 0.78rem; color: var(--muted); padding: 0 0.15rem; }
    .ids-summary b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
    .ids.collapsed .ids-summary { display: flex; }
    .ids.collapsed .ids-form { display: none; }
    .link-btn { background: none; border: none; padding: 0 0.25rem; min-height: 44px; color: #047857; font-weight: 650; font-size: 0.78rem; }
    .link-btn:hover { background: none; text-decoration: underline; }
    .ids-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0.55rem 0.8rem; align-items: end; }
    .ids-form .field { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
    .ids-form label { font-size: 0.72rem; }
    .ids-form .inline { display: flex; gap: 0.4rem; min-width: 0; }
    .ids-form .inline input { flex: 1 1 auto; min-width: 0; }
    .ids-form .inline button { flex: none; white-space: nowrap; }
    .ids-form .inline input, .ids-form .inline button { min-height: 44px; }
    .ids-form .inline button { min-width: 7.6rem; }
    @media (max-width: 420px) { .u-word { display: none; } }
    #idsBox button.primary, #idsBox button.primary:hover { background: #047857; border-color: #047857; color: #fff; }
    .ids-summary, .ids-form label { color: #526174; }
    .hero .k { color: #526174; }
    .hero { padding: 0.95rem 1rem 0.85rem; }
    .hero .k { display: block; font-size: 0.68rem; font-weight: 650; color: var(--card-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .hero-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
    .hero-team { font-size: 1.12rem; font-weight: 750; color: var(--card-ink); line-height: 1.2; }
    .hero-mgr { font-size: 0.78rem; color: var(--card-muted); margin-top: 0.1rem; }
    .hero-chip { flex: none; font-size: 0.7rem; font-weight: 750; padding: 0.18rem 0.5rem; border-radius: 999px; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .hero-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 0.8rem; }
    .hero-nums > div { background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; padding: 0.55rem 0.7rem; min-width: 0; }
    .hero-nums b { display: block; font-size: 2rem; line-height: 1.1; font-weight: 800; color: var(--card-ink); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .hero-nums small, .hero-rank small { display: block; font-size: 0.72rem; color: var(--card-muted); font-variant-numeric: tabular-nums; }
    .hero-nums .hitv { color: var(--rank-down); font-weight: 650; }
    .hero-rank { margin-top: 0.75rem; padding: 0.6rem 0.7rem; border-radius: 12px; border: 1px solid #a7f3d0; background: linear-gradient(180deg, #f0fdf4, #ffffff); }
    .hero-rank .rk { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
    .hero-rank .rk b { font-size: 1.55rem; font-weight: 800; color: var(--card-ink); font-variant-numeric: tabular-nums; }
    .move { font-size: 0.74rem; font-weight: 750; padding: 0.12rem 0.45rem; border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .move.up { color: #047857; background: #dcfce7; }
    .move.down { color: #be123c; background: #ffe4e6; }
    .move.flat { color: var(--card-muted); background: #f1f5f9; }
    .hero-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.7rem; }
    .hero-chips span { font-size: 0.74rem; padding: 0.2rem 0.55rem; border-radius: 999px; background: #f1f5f9; border: 1px solid var(--line); color: var(--card-text); font-variant-numeric: tabular-nums; }
    .hero-chips span b { color: var(--card-ink); }
    .hero-chips span.good { background: #ecfdf5; border-color: #a7f3d0; }
    .hero-foot { margin-top: 0.65rem; padding-top: 0.55rem; border-top: 1px solid var(--line); font-size: 0.72rem; color: var(--card-muted); font-variant-numeric: tabular-nums; }
    h1 { font-size: 1.05rem; margin: 0; letter-spacing: 0.02em; color: var(--text); }
    h1 span { color: #047857; }
    .pill {
      font-size: 0.75rem; padding: 0.15rem 0.45rem;
      border: 1px solid var(--line); border-radius: 999px;
      color: var(--muted); background: var(--bg-3);
    }
    .pill.live {
      color: #047857; border-color: #a7f3d0;
      background: #ecfdf5;
    }
    #notifyBtn.on { background: #ecfdf5; border-color: var(--accent); color: var(--accent); }
    .loading-msg { color: var(--muted); }

    #toastHost {
      position: fixed; left: 0.7rem; right: 0.7rem; bottom: 0.9rem;
      z-index: 50; display: flex; flex-direction: column-reverse; gap: 0.4rem;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: var(--card); color: var(--card-text);
      border: 1px solid var(--line);
      border-radius: 14px; padding: 0.7rem 0.85rem;
      box-shadow: var(--shadow-lg);
      animation: toastIn 0.18s ease-out;
    }
    .toast .kicker { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
    .toast .body { font-size: 0.95rem; font-weight: 650; margin-top: 0.12rem; color: var(--card-ink); }
    .toast.hint { background: #f8fafc; border-color: var(--line); }
    .toast.hint .kicker { color: var(--card-muted); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    main { padding: 0.9rem 1rem 3rem; max-width: 1400px; margin: 0 auto; width: 100%; min-width: 0; box-sizing: border-box; overflow-x: hidden; }
    form.bar { display: flex; gap: 0.45rem; flex-wrap: wrap; align-items: end; }
    label { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.75rem; color: var(--muted); }
    input, button, select {
      font: inherit; color: var(--text); background: var(--bg-2);
      border: 1px solid var(--line); border-radius: 10px; padding: 0.4rem 0.55rem;
    }
    input:focus, select:focus {
      outline: none; border-color: #a7f3d0;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
    }
    button {
      cursor: pointer; background: var(--bg-3); color: var(--text);
      border-color: var(--line);
    }
    button:hover { background: #e2e8f0; }
    button.primary {
      background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 650;
    }
    button.primary:hover { background: #047857; border-color: #047857; }
    .muted { color: var(--muted); }
    .error { color: var(--danger); white-space: pre-wrap; }
    .stale-banner { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin: 0 0 0.6rem; padding: 0.2rem 0.4rem 0.2rem 0.75rem; min-height: 44px; border-radius: 12px; background: #fffbeb; border: 1px solid #fde68a; color: #92400e; font-size: 0.82rem; font-weight: 600; }
    .stale-banner[hidden] { display: none; }
    .board-net { margin-top: 0.15rem; color: #92400e; font-size: 0.78rem; font-weight: 600; }
    .board-net[hidden] { display: none; }
    .stale-banner .sb-dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; flex: none; }
    .stale-banner .sb-text { flex: 1 1 auto; min-width: 0; }
    .stale-banner .link-btn { color: #047857; font-size: 0.82rem; }
    .load-error { display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    .load-error .retry-btn { min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #047857; background: #047857; color: #fff; font-weight: 650; font-size: 0.9rem; }
    .card {
      background: var(--card); color: var(--card-text);
      border: 1px solid var(--line); border-radius: 14px;
      padding: 0.8rem 0.9rem; margin: 0.75rem 0;
      box-shadow: var(--shadow);
      width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box;
    }
    .card .muted { color: var(--card-muted); }
    .card strong { color: var(--card-ink); }
    .card button {
      background: #f1f5f9; color: var(--card-text); border-color: var(--line);
    }
    .card button:hover { background: #e2e8f0; }
    .card button.primary, .card button.active {
      background: #ecfdf5; border-color: #a7f3d0; color: #047857;
    }
    .stats { display: flex; flex-wrap: wrap; gap: 0.7rem 1.1rem; }
    .stat { min-width: 4.5rem; }
    .stat b { display: block; font-size: 1.15rem; }
    .stat span { font-size: 0.72rem; color: var(--card-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat b { color: var(--card-ink); }
    .leagues { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
    .leagues button { font-size: 0.85rem; }
    .leagues button.active {
      background: #ecfdf5; border-color: #a7f3d0; color: #047857;
    }
    .fixtures { display: flex; gap: 0.45rem; overflow-x: auto; padding-bottom: 0.2rem; }
    .fx {
      flex: 0 0 auto; background: #f8fafc; border: 1px solid var(--line);
      border-radius: 12px; padding: 0.35rem 0.55rem; min-width: 9.4rem; font-size: 0.8rem;
      color: var(--card-text);
    }
    .fx .score { font-weight: 650; color: var(--card-ink); }
    .fx .muted { color: var(--card-muted); }
    .fx.live { border-color: var(--accent-bright); box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.25); }
    .fx.done { opacity: 0.72; }
    .fx-players { margin-top: 0.28rem; font-size: 0.72rem; line-height: 1.35; }
    .fx-players .role { color: #b45309; font-weight: 650; }
    .fx-players .pts { color: var(--accent); font-weight: 650; }
    .toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    table.live { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; color: var(--card-text); }
    table.live th, table.live td { padding: 0.38rem 0.4rem; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
    table.live th:nth-child(3), table.live td:nth-child(3),
    table.live th.name, table.live td.name { text-align: left; white-space: normal; }
    table.live thead th {
      position: sticky; top: 52px; background: var(--card); cursor: pointer; user-select: none;
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--card-muted);
    }
    table.live tbody tr { cursor: pointer; }
    table.live tbody tr:hover { background: #f1f5f9; }
    table.live tbody tr.selected { background: #ecfdf5; }
    .chip { color: var(--chip); font-weight: 650; }
    .note { font-size: 0.8rem; color: #b45309; }
    .card .tag { color: var(--card-muted); }
    .card .scorers { color: var(--card-muted); }
    .card .scorers b { color: var(--accent); }
    .split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.8rem; width: 100%; min-width: 0; max-width: 100%; }
    .split > * { min-width: 0; max-width: 100%; }
    @media (min-width: 1100px) { .split.has-detail { grid-template-columns: minmax(0, 1fr) minmax(420px, 36%); } }
    /* Picks table: header must not stick inside the horizontally scrollable wrapper (it covered row 2). */
    .picks-wrap table.live thead th { position: static; top: auto; }
    table.live.players th:nth-child(2), table.live.players td:nth-child(2) { text-align: left; white-space: normal; }
    table.live.players th:nth-child(3), table.live.players td:nth-child(3) { text-align: right; white-space: nowrap; }
    /* 16px inputs: iOS zooms the page on focus for anything smaller. */
    input, select { font-size: 16px; }
    .players th, .players td { text-align: left; }
    .players td.num, .players th.num { text-align: right; }
    /* Keep wide squad tables from expanding the league board (clips GW/Total on phones). */
    .fx-lu { color: var(--accent); font-weight: 700; }
    .picks-wrap { width: 100%; min-width: 0; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table.live.players { width: 100%; min-width: 0; }
    .tag { font-size: 0.7rem; color: var(--muted); }
    .in { color: var(--accent); }
    .out { color: var(--danger); }
    .bench { opacity: 0.72; }
    .scorers { font-size: 0.75rem; color: var(--muted); white-space: normal; line-height: 1.35; margin-top: 0.2rem; }
    .scorers b { color: var(--accent); font-weight: 650; }
    .scorers .zero { opacity: 0.7; }
    .standings-table-wrap { width: 100%; }
    td.gw-live { font-variant-numeric: tabular-nums; font-weight: 650; }
    td.gw-live .hit { display: block; font-size: 0.68rem; color: var(--danger); font-weight: 650; }

    /* LiveFPL-style mini-league board — light */
    .league-board {
      background: transparent; border: none; padding: 0; margin: 0.75rem 0;
      width: 100%; min-width: 0; max-width: 100%;
      overflow-x: hidden; box-sizing: border-box;
    }
    .league-toolbar {
      display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center;
      justify-content: space-between;
      background: var(--card); color: var(--card-text);
      border: 1px solid var(--line);
      border-radius: 14px; padding: 0.55rem 0.7rem;
      box-shadow: var(--shadow);
      width: 100%; min-width: 0; box-sizing: border-box;
    }
    .league-toolbar .muted { color: var(--card-muted); }
    .league-toolbar button {
      background: #f1f5f9; color: var(--card-text); border-color: var(--line);
    }
    .league-toolbar button:hover { background: #e2e8f0; }
    .league-toolbar button.active {
      background: #ecfdf5; border-color: #a7f3d0; color: #047857;
    }
    .league-title {
      text-align: center; color: var(--text); font-weight: 650;
      margin: 0.85rem 0 0.45rem; font-size: 0.98rem; letter-spacing: 0.01em;
      max-width: 100%; min-width: 0; padding: 0 0.35rem; box-sizing: border-box;
      overflow-wrap: anywhere; word-break: break-word;
    }
    .league-cols {
      display: grid;
      grid-template-columns: 2.6rem minmax(0, 1.6fr) 2.1rem 3.4rem 2.4rem 2.8rem 1rem;
      gap: 0.25rem; align-items: end;
      padding: 0.25rem 0.75rem 0.4rem;
      color: var(--muted); font-size: 0.72rem; text-transform: none; font-weight: 600;
      width: 100%; min-width: 0; box-sizing: border-box;
    }
    .league-cols span { text-align: center; }
    .league-cols .c-mgr { text-align: left; padding-left: 0.15rem; }
    .league-cards { display: flex; flex-direction: column; gap: 0.55rem; width: 100%; min-width: 0; }
    .lf-card {
      background: var(--card); color: var(--card-text);
      border-radius: 14px; padding: 0.55rem 0.65rem 0.6rem;
      box-shadow: var(--shadow);
      cursor: pointer; border: 1px solid var(--line);
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
      width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box; overflow: hidden;
    }
    .lf-card:hover { box-shadow: var(--shadow-lg); border-color: #cbd5e1; }
    .lf-card.selected { border-color: #6ee7b7; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25), var(--shadow); }
    .lf-row {
      display: grid;
      grid-template-columns: 2.6rem minmax(0, 1.6fr) 2.1rem 3.4rem 2.4rem 2.8rem 1rem;
      gap: 0.25rem; align-items: center;
      width: 100%; min-width: 0;
    }
    .lf-row > * { min-width: 0; }
    .lf-pos { display: flex; flex-direction: column; align-items: center; gap: 0.12rem; }
    .rank-pill {
      width: 2.15rem; height: 2.15rem; border-radius: 999px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 0.78rem; line-height: 1;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.12);
    }
    .rank-pill .arr { font-size: 0.62rem; line-height: 0.9; margin-bottom: 0.02rem; }
    .rank-pill.rise { background: var(--rank-up); }
    .rank-pill.drop { background: var(--rank-down); }
    .rank-pill.flat { background: var(--rank-flat); }
    .rank-delta {
      font-size: 0.65rem; color: var(--card-muted); font-variant-numeric: tabular-nums;
      font-weight: 650; min-height: 0.85rem;
    }
    .rank-delta.rise { color: #047857; }
    .rank-delta.drop { color: var(--rank-down); }
    .lf-mgr { min-width: 0; padding-right: 0.15rem; }
    .lf-mgr .team {
      font-weight: 750; color: var(--card-ink); font-size: 0.92rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lf-mgr .name {
      color: var(--card-muted); font-size: 0.78rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lf-pills { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.28rem; }
    .mini-pill {
      font-size: 0.65rem; padding: 0.12rem 0.4rem; border-radius: 999px;
      border: 1px solid var(--line); color: var(--card-ink); background: #f8fafc;
      font-weight: 650; white-space: nowrap;
    }
    .mini-pill.chip {
      background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8;
    }
    .lf-yet, .lf-gw, .lf-total {
      text-align: center; font-weight: 750; color: var(--card-ink);
      font-variant-numeric: tabular-nums; font-size: 0.95rem;
    }
    .lf-gw .hit {
      display: block; font-size: 0.62rem; color: var(--rank-down); font-weight: 700;
    }
    .lf-cap {
      text-align: center; min-width: 0;
    }
    .lf-cap .c-name {
      display: block; font-weight: 750; color: var(--card-ink); font-size: 0.78rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lf-cap .vc-name {
      display: block; color: var(--card-muted); font-size: 0.65rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lf-chevron {

    .mc-tabs { gap: 0.3rem; }

</head>
<body>
  <header>
    <div class="appbar">
      <h1>FPL <span>Live</span> Tracker</h1>
      <span class="status-pill" id="statusPill"><i class="sdot" aria-hidden="true"></i><span id="gwPill">GW —</span><span id="livePill">idle</span></span>
      <span class="updated" id="refreshHint" aria-live="off"></span>
      <button type="button" id="notifyBtn" class="icon-btn" aria-pressed="false" aria-label="Squad notifications off" title="Squad notifications"></button>
    </div>
  </header>
  <div id="toastHost" aria-live="polite"></div>
  <main>
    <div class="stale-banner" id="staleBanner" role="status" aria-live="polite" hidden><i class="sb-dot" aria-hidden="true"></i><span class="sb-text" id="staleText"></span><button type="button" class="link-btn" id="staleRetry" hidden>Retry now</button></div>
    <section class="ids" id="idsBox">
      <div class="ids-summary">
        <span class="ids-text">FPL ID <b id="idsEntry">—</b><span id="idsLeagueWrap"> · League <b id="idsLeague">—</b></span></span>
        <button type="button" class="link-btn" id="idsEdit">Change IDs</button>
      </div>
      <form class="bar ids-form" id="search">
        <div class="field">
          <label for="entryIdInput">FPL ID</label>
          <div class="inline"><input id="entryIdInput" name="entryId" inputmode="numeric" placeholder="e.g. 1234567" required><button class="primary" type="submit">Live rank</button></div>
        </div>
        <div class="field">
          <label for="leagueIdInput">League ID</label>
          <div class="inline"><input id="leagueIdInput" name="leagueId" inputmode="numeric" placeholder="optional"><button type="button" id="openLeague">Open league</button></div>
        </div>
      </form>
    </section>
    <div id="app"></div>
    <div id="matchSheet" hidden role="dialog" aria-modal="true" aria-label="Match details"></div>
    <section class="card collapsed" id="homeBoard">
      <div class="board-head">
        <div>
          <strong>Live points + price watch</strong>
          <div class="muted" id="boardNote">Loading player board…</div>
          <div class="board-net" id="boardNet" role="status" hidden></div>
        </div>
        <button type="button" id="boardToggle">Show board</button>
      </div>
      <div class="board-search" role="search">
        <span class="bs-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
        <input type="search" id="boardSearch" placeholder="Search player or team" aria-label="Search players"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="bs-clear" id="boardSearchClear" aria-label="Clear search" hidden>&times;</button>
      </div>
      <div class="chips" id="boardChips">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="price">Price rise</button>
      </div>
      <div id="boardMount"></div>
    </section>
    <section class="card" id="gwStats">
      <div class="board-head">
        <div>
          <strong>GW Stats</strong>
          <div class="muted" id="gwStatsNote">Loading top 10k transfers…</div>
        </div>
      </div>
      <div id="gwStatsMount"></div>
    </section>
  </main>
  <script>
    const app = document.getElementById("app");
    const API_TIMEOUT_MS = 20000;
    const state = {
      entryId: null, gameweek: null, live: false, autosubs: true,
      entry: null, leagues: [], leaguesError: null, leaguesStale: false,
      league: null, picks: null, sort: { key: "liveRank", dir: 1 },
      timer: null, notifyTimer: null,
      notify: false, notifySeen: {}, notifyReady: false,
      board: null, prices: null, boardFilter: "all", boardQuery: "", boardSort: { key: "livePoints", dir: -1 }, boardOpen: false
    };

    function el(html) {
      const raw = String(html == null ? "" : html).trim();
      const isTr = /^<tr[\s>]/i.test(raw);
      const isCell = /^<t[dh][\s>]/i.test(raw);
      const d = document.createElement("div");
      if (isTr) {
        d.innerHTML = "<table><tbody>" + raw + "</tbody></table>";
        return d.querySelector("tr");
      }
      if (isCell) {
        d.innerHTML = "<table><tbody><tr>" + raw + "</tr></tbody></table>";
        return d.querySelector("td,th");
      }
      d.innerHTML = raw;
      return d.firstElementChild;
    }
    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function fmt(n) { return n == null || n === "" ? "—" : n; }
    function rankArrow(live, official) {
      const L = Number(live), O = Number(official);
      if (!L || !O) return "";
      const d = O - L;
      if (d === 0) return "<span class='arrow flat'>→ 0</span>";
      const places = Math.abs(d).toLocaleString();
      if (d > 0) return "<span class='arrow up'>▲ " + places + "</span>";
      return "<span class='arrow down'>▼ " + places + "</span>";
    }
    function liveOverallHtml(e) {
      if (!e.liveOverallEstimateAvailable || e.liveOverallRankEstimate == null) return "estimate unavailable";
      return fmtRank(e.liveOverallRankEstimate) + " (estimate) " + rankArrow(e.liveOverallRankEstimate, e.startOfGwOverallRank);
    }
    function placeDeltaHtml(team) {
      return rankArrow(team.liveRank, team.lastRank);
    }
    function placeMove(team) {
      const live = Number(team.liveRank), last = Number(team.lastRank);
      if (!live || !last) return { dir: "flat", delta: 0 };
      const d = last - live;
      if (d > 0) return { dir: "rise", delta: d };
      if (d < 0) return { dir: "drop", delta: d };
      return { dir: "flat", delta: 0 };
    }
    function rankPillHtml(team) {
      const move = placeMove(team);
      const arrow = move.dir === "rise" ? "↑" : (move.dir === "drop" ? "↓" : "·");
      const deltaTxt = move.dir === "flat" ? "" : ((move.delta > 0 ? "+" : "") + move.delta);
      return "<div class='lf-pos'>" +
        "<div class='rank-pill " + move.dir + "'><span class='arr'>" + arrow + "</span><span>" + fmt(team.liveRank) + "</span></div>" +
        "<div class='rank-delta " + move.dir + "'>" + deltaTxt + "</div></div>";
    }
    function captainPair(team) {
      const players = team.players || [];
      const cap = players.find((p) => p.captain);
      const vc = players.find((p) => p.viceCaptain);
      return {
        captain: (cap && (cap.webName || cap.name)) || "",
        vice: (vc && (vc.webName || vc.name)) || ""
      };
    }
    function playedCount(team) {
      const starters = (team.players || []).filter((p) => !p.onBench);
      const total = starters.length || 11;
      const rem = Number(team.playersRemaining);
      if (!Number.isFinite(rem)) return null;
      return { played: Math.max(0, total - rem), total: total };
    }

    function fmtMoney(n) { return n == null ? "—" : "£" + Number(n).toFixed(1) + "m"; }
    function fmtRank(n) { return n == null ? "—" : Number(n).toLocaleString(); }
    function fmtAge(seconds) {
      if (seconds == null) return "—";
      const s = Number(seconds);
      if (s < 60) return s + "s ago";
      if (s < 3600) return Math.floor(s / 60) + "m ago";
      return (s / 3600).toFixed(1).replace(/\.0$/, "") + "h ago";
    }
    function fmtEo(eo) {
      if (eo == null || eo === "") return "—";
      return (Number(eo) * 100).toFixed(0) + "%";
    }
    function fmtNowCost(n) {
      if (n == null || n === "") return "";
      return "£" + Number(n).toFixed(1);
    }
    function fmtGwPriceChange(n) {
      if (n == null || n === "" || Number(n) === 0) return "";
      const v = Number(n);
      const sign = v > 0 ? "+" : "−";
      return sign + "£" + Math.abs(v).toFixed(1);
    }
    function priceHtml(pl) {
      const cost = fmtNowCost(pl.nowCost);
      if (!cost) return "";
      const ch = fmtGwPriceChange(pl.costChangeEvent);
      const cls = Number(pl.costChangeEvent) > 0 ? " up" : (Number(pl.costChangeEvent) < 0 ? " down" : "");
      return "<span class='price" + cls + "'>" + cost + (ch ? (" " + ch) : "") + "</span>";
    }
    function pricePlain(pl) {
      const cost = fmtNowCost(pl.nowCost);
      if (!cost) return "";
      const ch = fmtGwPriceChange(pl.costChangeEvent);
      return cost + (ch ? (" " + ch) : "");
    }

    async function api(path) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), API_TIMEOUT_MS);
      try {
        const res = await fetch(path, { signal: ctrl.signal });
        const text = await res.text();
        let data;
        try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }
        if (!res.ok) throw new Error(data.error || data.message || ("HTTP " + res.status));
        return data;
      } catch (err) {
        if (err && (err.name === "AbortError" || err.name === "TimeoutError")) {
          throw new Error("Official FPL API timed out. Try again in a moment.");
        }
        throw err;
      } finally {
        clearTimeout(timer);
      }
    }

    function setPills(gw, live) {
      document.getElementById("gwPill").textContent = gw ? ("GW " + gw) : "GW —";
      document.getElementById("livePill").textContent = live ? "LIVE" : "not live";
      document.getElementById("statusPill").classList.toggle("live", !!live);
    }

    function persistView() {
      const params = new URLSearchParams();
      if (state.entryId) params.set("entry", String(state.entryId));
      if (state.league && state.league.leagueId) params.set("league", String(state.league.leagueId));
      const qs = params.toString();
      const next = qs ? (location.pathname + "?" + qs) : location.pathname;
      history.replaceState(null, "", next);
      try {
        if (state.entryId) localStorage.setItem("fpl.entryId", String(state.entryId));
        if (state.league && state.league.leagueId) localStorage.setItem("fpl.leagueId", String(state.league.leagueId));
        else localStorage.removeItem("fpl.leagueId");
      } catch (e) {}
      const entryInput = document.querySelector('input[name="entryId"]');
      const leagueInput = document.querySelector('input[name="leagueId"]');
      if (entryInput && state.entryId) entryInput.value = state.entryId;
      if (leagueInput) leagueInput.value = (state.league && state.league.leagueId) || "";
      paintIds();
    }
    // IDs form collapses to a one-line summary once an entry is loaded; "Change IDs" reopens it.
    function paintIds() {
      const box = document.getElementById("idsBox");
      if (!box) return;
      document.getElementById("idsEntry").textContent = state.entryId || "—";
      const lid = state.league && state.league.leagueId;
      document.getElementById("idsLeague").textContent = lid || "—";
      document.getElementById("idsLeagueWrap").hidden = !lid;
      box.classList.toggle("collapsed", !!state.entryId && !state.editIds);
    }
    document.getElementById("idsEdit").addEventListener("click", () => {
      state.editIds = true; paintIds();
      const inp = document.querySelector('input[name="entryId"]'); if (inp) inp.focus();
    });
    // "Updated Xs ago" in the app bar (replaces the static auto-refresh hint).
    // One source of truth for "how old is what's on screen": state.okAt[kind] is when each kind last
    // got data from the server (minus the server's stale dataAge). The header and the banner both
    // read pageUpdatedAt(), the oldest of the main content kinds actually on screen.
    state.okAt = { entry: 0, league: 0, board: 0 };
    function pageUpdatedAt() {
      const ts = [];
      if (state.entry && state.okAt.entry) ts.push(state.okAt.entry);
      if (state.league && state.okAt.league) ts.push(state.okAt.league);
      return ts.length ? Math.min.apply(null, ts) : 0;
    }
    function markUpdated(kind, ageSec) {
      state.okAt[kind] = Date.now() - Math.max(0, Number(ageSec) || 0) * 1000;
      state.updatedAt = pageUpdatedAt() || state.updatedAt;
      paintUpdated();
    }
    function paintUpdated() {
      const node = document.getElementById("refreshHint");
      if (!node) return;
      const at = pageUpdatedAt() || state.updatedAt;
      if (!at) { node.textContent = ""; return; }
      const sec = Math.max(0, Math.round((Date.now() - at) / 1000));
      node.innerHTML = "<span class='u-word'>Updated </span>" + (sec < 60 ? sec + "s" : Math.round(sec / 60) + "m") + " ago";
      node.title = state.refreshLive ? "Auto-refreshing while matches are live" : "Fixtures not started";
    }
    setInterval(() => { paintUpdated(); paintStale(); paintBoardNet(); }, 5000);

    // ---- Resilience: last-good data per view + "FPL is slow" banner ----
    // state.net[kind] = { failing, stale, cached, at } for kind in entry / league / board.
    // A failed background refresh never replaces data already on screen; only a first load with
    // nothing to show renders an error card with Retry.
    const LAST_PREFIX = "fpl.last.";
    const LAST_MAX_AGE_MS = 12 * 3600 * 1000;
    state.net = { entry: null, league: null, board: null };
    function saveLast(kind, id, data) {
      const key = LAST_PREFIX + kind + (id != null ? "." + id : "");
      const at = Date.now() - Math.max(0, Number(data && data.dataAge) || 0) * 1000;
      try {
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const k = localStorage.key(i);
          if (k && k !== key && k.indexOf(LAST_PREFIX + kind + ".") === 0) localStorage.removeItem(k);
        }
        localStorage.setItem(key, JSON.stringify({ t: at, d: data }));
      } catch (e) {
        try { localStorage.removeItem(key); } catch (e2) {}
      }
    }
    function readLast(kind, id) {
      try {
        const raw = localStorage.getItem(LAST_PREFIX + kind + (id != null ? "." + id : ""));
        if (!raw) return null;
        const o = JSON.parse(raw);
        if (!o || !o.d || !o.t || Date.now() - o.t > LAST_MAX_AGE_MS) return null;
        return o;
      } catch (e) { return null; }
    }
    function fmtAgo(ms) {
      const sec = Math.max(0, Math.round(ms / 1000));
      if (sec < 60) return sec + "s ago";
      const m = Math.round(sec / 60);
      if (m < 60) return m + "m ago";
      return Math.round(m / 60) + "h ago";
    }
    // The page-wide banner is only for a real problem with the main content (entry / league):
    //  - a refresh actually failed or timed out (failing), or
    //  - the server had to serve saved data older than a meaningful threshold (stale).
    // A short stale serve, or a slow-but-working FPL, never shows it. The board card shows its own
    // problems inline (#boardNet); mini-league list problems stay inline in that card.
    const STALE_LIVE_SEC = 180;   // live gameweek: 3 min
    const STALE_IDLE_SEC = 900;   // otherwise: 15 min
    const CACHED_SHOW_SEC = 60;   // boot paint from localStorage only mentioned if older than this
    const PAGE_KINDS = ["entry", "league"];
    function liveNow() {
      return !!((state.board && state.board.live) || (state.entry && state.entry.live) || (state.league && state.league.live));
    }
    function staleThresholdSec() { return liveNow() ? STALE_LIVE_SEC : STALE_IDLE_SEC; }
    function setNet(kind, info) { state.net[kind] = info; paintStale(); if (kind === "board") paintBoardNet(); }
    function netOk(kind, data) {
      const age = Math.max(0, Number(data && data.dataAge) || 0);
      const old = !!(data && data.stale) && age > staleThresholdSec();
      setNet(kind, old ? { stale: true } : null);
      if (old) scheduleRetry(); else maybeClearRetry();
    }
    function netFail(kind) {
      setNet(kind, { failing: true });
      scheduleRetry();
    }
    function pageProblems() {
      return PAGE_KINDS.filter((k) => (k === "entry" ? state.entry : state.league)).map((k) => state.net[k]).filter(Boolean);
    }
    function paintStale() {
      const node = document.getElementById("staleBanner");
      if (!node) return;
      // While a resume refresh is in flight we don't know yet; only a failed refresh shows the banner.
      if (state.resuming) { node.hidden = true; return; }
      const items = pageProblems();
      const failing = items.some((x) => x.failing);
      const stale = items.some((x) => x.stale);
      const at = pageUpdatedAt() || state.updatedAt || Date.now();
      const cached = !failing && !stale && items.some((x) => x.cached) && Date.now() - at > CACHED_SHOW_SEC * 1000;
      if (!failing && !stale && !cached) { node.hidden = true; return; }
      const ago = fmtAgo(Date.now() - at);
      document.getElementById("staleText").textContent = failing
        ? "Updated " + ago + " · FPL is slow, retrying"
        : stale ? "Updated " + ago + " · FPL is slow, showing saved data"
        : "Saved data from " + ago + " · refreshing…";
      document.getElementById("staleRetry").hidden = !(failing || stale);
      node.hidden = false;
    }
    function paintBoardNet() {
      const node = document.getElementById("boardNet");
      if (!node) return;
      const n = state.net.board;
      if (!n || !(n.failing || n.stale) || state.resuming) { node.hidden = true; node.textContent = ""; return; }
      node.textContent = "FPL is slow · board from " + fmtAgo(Date.now() - (state.okAt.board || Date.now()));
      node.hidden = false;
    }
    function refreshNow() {
      const jobs = [loadBoard(true)];
      if (state.entryId) jobs.push(loadEntry(state.entryId, true));
      if (state.league) jobs.push(loadLeague(state.league.leagueId, true));
      return Promise.allSettled(jobs);
    }
    document.getElementById("staleRetry").addEventListener("click", () => {
      if (state.retryTimer) { clearTimeout(state.retryTimer); state.retryTimer = null; }
      refreshNow();
    });
    function scheduleRetry() {
      if (state.retryTimer) return;
      state.retryCount = (state.retryCount || 0) + 1;
      const wait = Math.min(60000, 20000 * state.retryCount);
      state.retryTimer = setTimeout(() => { state.retryTimer = null; refreshNow(); }, wait);
    }
    function maybeClearRetry() {
      const bad = Object.values(state.net).some((x) => x && (x.failing || x.stale));
      if (bad) return;
      state.retryCount = 0;
      if (state.retryTimer) { clearTimeout(state.retryTimer); state.retryTimer = null; }
    }
    function loadErrorCard(message, onRetry) {
      const card = el("<section class='card load-error'><p class='error'></p><button type='button' class='retry-btn'>Retry</button></section>");
      const slow = !message || /FPL is slow|timed out/i.test(message);
      card.querySelector(".error").textContent = slow
        ? "FPL is slow right now and there's no saved data on this device yet. Try again in a moment."
        : message;
      card.querySelector(".retry-btn").onclick = onRetry;
      return card;
    }


    function notifySupported() {
      return typeof Notification !== "undefined";
    }
    function notifyGranted() {
      return notifySupported() && Notification.permission === "granted";
    }
    function paintNotifyBtn() {

    function showToast(body, hint) {

        (hint ? "FPL Live" : "Squad tick") + "</div><div class='body'></div></div>");

    function primeNotify(players) {
      state.notifySeen = {};

      });

    function maybeNotifySquad(players) {
      if (!state.notify) return;
      const list = players || [];
      if (!state.notifyReady) {
        primeNotify(list);
        return;
      }
      list.forEach((pl) => {
        const id = pl.element;
        if (id == null) return;
        const next = Number(pl.contribution) || 0;
        const prev = state.notifySeen[id];
        state.notifySeen[id] = next;
        if (prev == null || next <= prev) return;
        const name = pl.webName || pl.name || ("Player " + id);
        const tag = pl.captain ? " (C)" : (pl.viceCaptain ? " (VC)" : "");
        const body = name + tag + " " + prev + " → " + next;
        showToast(body, false);
        try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
        if (!notifyGranted()) return;
        try {
          const n = new Notification("FPL Live", {
            body: body,
            tag: "fpl-pts-" + id,
            renotify: true

          n.onclick = () => { try { window.focus(); } catch (e) {} n.close(); };
        } catch (e) {}
      });

    function stopNotifyPoll() {

    async function setNotify(on) {

    async function loadEntry(entryId, quiet) {

    function squadPlayers() {
      return (state.entry && state.entry.players)
        || (state.picks && state.picks.players)
        || [];
    }

    function playersInFixture(fx) {
      const home = String(fx.home || "").toUpperCase();
      const away = String(fx.away || "").toUpperCase();
      return squadPlayers().filter((pl) => {
        const team = String(pl.team || "").toUpperCase();
        return team && (team === home || team === away);
      });
    }

    // ---- live GW scoreboard for the fixtures strip: 10s refresh while any match is live ----
    const SCOREBOARD_POLL_MS = 10000;
    const APP_BUILD = "@APP_BUILD@";
    function scoreboardFor(id) {
      const sb = state.scoreboard;
      if (!sb || sb.gameweek !== state.gameweek) return null;
      return (sb.fixtures || []).find((f) => f.id === id) || null;
    }
    // Use the scoreboard row unless the league/entry fixture is demonstrably newer (FPL minutes
    // further along, or finished while the scoreboard says not), so the strip never goes backwards.
    function freshestScore(fx) {
      const sbf = scoreboardFor(fx.id);
      if (!sbf) return null;
      const fxDone = !!fx.finished, sbDone = !!sbf.finished;
      if (fxDone && !sbDone) return null;
      if (!fxDone && !sbDone && (fx.minutes || 0) > (sbf.minutes || 0) + 1) return null;
      return sbf;
    }
    function stripFixtures() {
      return (state.league && state.league.fixtures) || (state.entry && state.entry.fixtures) || [];
    }
    function fxClock(fx) {
      return fx.clock && fx.state !== "pre" ? fx.clock : (fx.finished ? "FT" : (fx.started ? (fx.minutes + "'") : fxKickoff(fx.kickoffTime)));
    }
    // Upcoming kickoff in the browser's local time, e.g. "Sun 8:30 AM" (no raw UTC).
    function fxKickoff(iso) {
      if (!iso) return "TBC";
      const d = new Date(iso);
      if (isNaN(d)) return "TBC";
      return d.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
    }
    // Patch scores/clocks in the existing strip: no re-render, no scroll jump.
    function updateStripInPlace() {
      const strip = document.getElementById("fxStrip");
      const sb = state.scoreboard;
      if (!strip || !sb || sb.gameweek !== state.gameweek) return;
      const src = strip.querySelector(".fx-src");
      if (src) src.hidden = sb.source !== "ESPN";
      (sb.fixtures || []).forEach((row) => {
        const node = strip.querySelector(".fx[data-fx='" + row.id + "']");
        if (!node) return;
        const baseFx = stripFixtures().find((x) => x.id === row.id) || {};
        const f = freshestScore(baseFx) || Object.assign({}, baseFx, { clock: null, state: null });
        const score = f.started || f.finished ? (fmt(f.homeScore) + "–" + fmt(f.awayScore)) : "vs";
        const sc = node.querySelector(".score");
        if (sc && sc.textContent !== score) {
          sc.textContent = score;
          node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash");
        }
        const clk = node.querySelector(".clk");
        const text = fxClock(Object.assign({}, baseFx, f));
        if (clk && clk.textContent !== text) clk.textContent = text;
        node.classList.toggle("live", f.started && !f.finished);
        node.classList.toggle("done", !!f.finished);
        paintLineupTag(node, row.lineups && !f.started);
      });
    }
    function paintLineupTag(node, on) {
      let tag = node.querySelector(".fx-lu");
      if (on && !tag) {
        tag = el("<span class='fx-lu'> · Lineups ✓</span>");
        const m = node.querySelector(".muted");
        if (m) m.insertBefore(tag, m.querySelector(".fx-open") ? m.querySelector(".fx-open").previousSibling : null);
      } else if (!on && tag) tag.remove();
    }
    function applyScoreboard(sb) {
      if (!sb || sb.gameweek !== state.gameweek) return;
      if (state.scoreboard && sb.generatedAt && state.scoreboard.generatedAt && sb.generatedAt < state.scoreboard.generatedAt) return;
      state.scoreboard = sb;
      state.scoreboardAt = Date.now();
      if (sb.build) checkBuild(sb.build);
      try { updateStripInPlace(); } catch (e) { console.error("strip update failed", e); }
      scheduleScoreboard();
    }
    // Watchdog: while any match is live, refetch whenever the strip hasn't had fresh data for 20s
    // (stream stalled, never delivered, or SSE unsupported). Unchanged scores produce no pushes,
    // so this doubles as the fallback poll.
    function scoreboardWatchdog() {
      if (document.visibilityState === "hidden") return;
      if (!state.scoreboardAt || Date.now() - state.scoreboardAt > 20000) loadScoreboard();
    }
    async function loadScoreboard() {
      if (!state.gameweek) return;
      try { applyScoreboard(await api("/live/scoreboard?gameweek=" + state.gameweek)); } catch (e) {}
    }
    function paintStripDot() {
      const dot = document.querySelector("#fxStrip .fx-dot");
      if (dot) { dot.classList.toggle("on", !!state.sbStreamOpen); dot.title = state.sbStreamOpen ? "Live scores: push connected" : "Live scores: polling"; }
    }
    function stopScoreboardStream() {
      if (state.sbStream) { clearTimeout(state.sbStream.__watch); try { state.sbStream.close(); } catch (e) {} }
      state.sbStream = null;
      state.sbStreamOpen = false;
      paintStripDot();
    }
    function startScoreboardStream() {
      if (state.sbStream || typeof EventSource === "undefined" || state.sbStreamDisabled) return false;
      const gw = state.gameweek;
      const es = new EventSource("/live/scoreboard/stream?gameweek=" + gw);
      es.__gw = gw;
      state.sbStream = es;
      let gotSnapshot = false;
      es.onopen = () => {
        if (state.sbStream !== es) return;
        state.sbStreamFailures = 0;
        // No snapshot within 20s of opening: treat the stream as broken and rely on polling.
        clearTimeout(es.__watch);
        es.__watch = setTimeout(() => {
          if (state.sbStream === es && !gotSnapshot) { state.sbStreamDisabled = true; stopScoreboardStream(); loadScoreboard(); }
        }, 20000);
      };
      const onData = (ev) => {
        if (state.sbStream !== es) return;
        gotSnapshot = true;
        state.sbStreamOpen = true;
        paintStripDot();
        try { applyScoreboard(JSON.parse(ev.data)); } catch (e) { console.error(e); }
      };
      es.addEventListener("snapshot", onData);
      es.addEventListener("final", (ev) => { onData(ev); stopScoreboardStream(); scheduleScoreboard(); });
      es.addEventListener("error", (ev) => {
        if (state.sbStream !== es) return;
        state.sbStreamOpen = false; paintStripDot();
        state.sbStreamFailures = (state.sbStreamFailures || 0) + 1;
        if ((ev && ev.data) || es.readyState === 2 || state.sbStreamFailures >= 3) {
          state.sbStreamDisabled = state.sbStreamFailures >= 3 || !!(ev && ev.data);
          stopScoreboardStream();
          loadScoreboard();
        }
      });
      return true;
    }
    function scheduleScoreboard() {
      const fixtures = stripFixtures();
      const live = (state.scoreboard && state.scoreboard.gameweek === state.gameweek)
        ? state.scoreboard.live
        : fixtures.some((f) => f.started && !f.finished);
      if (!live || !fixtures.length) {
        stopScoreboardStream();
        if (state.scoreboardTimer) { clearInterval(state.scoreboardTimer); state.scoreboardTimer = null; }
        // A kickoff within 3h: refresh the scoreboard every 60s so lineups and the kickoff itself appear.
        const now = Date.now();
        const soon = fixtures.some((f) => !f.started && f.kickoffTime && Date.parse(f.kickoffTime) - now < 3 * 3600e3 && Date.parse(f.kickoffTime) - now > -600e3);
        if (soon && !state.sbPreTimer) state.sbPreTimer = setInterval(loadScoreboard, 60000);
        if (!soon && state.sbPreTimer) { clearInterval(state.sbPreTimer); state.sbPreTimer = null; }
        return;
      }
      if (state.sbPreTimer) { clearInterval(state.sbPreTimer); state.sbPreTimer = null; }
      if (!state.scoreboardTimer) state.scoreboardTimer = setInterval(scoreboardWatchdog, SCOREBOARD_POLL_MS);
      if (state.sbStream && state.sbStream.__gw !== state.gameweek) stopScoreboardStream();
      startScoreboardStream();
    }
    // iOS Home Screen apps suspend timers and drop connections in the background: on every
    // resume, check the build, refetch everything now and reconnect streams.
    let lastResume = 0;
    function onResume() {
      if (document.visibilityState === "hidden") return;
      const now = Date.now();
      if (now - lastResume < 2000) return;
      lastResume = now;
      checkBuild();
      state.sbStreamDisabled = false; state.sbStreamFailures = 0;
      stopScoreboardStream();
      if (stripFixtures().length) loadScoreboard();
      // Refresh everything on screen right away. Hide the banner until that refresh settles: it only
      // comes back if the refresh actually fails (no "21m ago" flash from a backgrounded PWA).
      if (state.retryTimer) { clearTimeout(state.retryTimer); state.retryTimer = null; }
      state.retryCount = 0;
      if (state.entryId || state.league || state.board) {
        state.resuming = true; paintStale(); paintBoardNet();
        const settle = () => { state.resuming = false; paintStale(); paintBoardNet(); };
        refreshNow().then(settle, settle);
      }
      if (matchState.id != null) {
        matchState.streamDisabled = false; matchState.streamFailures = 0;
        stopMatchStream();
        loadMatch(true);
      }
    }
    document.addEventListener("visibilitychange", onResume);
    window.addEventListener("pageshow", (ev) => { if (ev.persisted) onResume(); else lastResume = Date.now(); });
    window.addEventListener("focus", onResume);
    window.addEventListener("online", onResume);
    // Build check: reload once when the server runs a newer build than this page (stale Home Screen app).
    async function checkBuild(serverBuild) {
      try {
        const b = serverBuild || (await api("/version")).build;
        if (!b || b === APP_BUILD) return;
        if (matchState.id != null) return;
        if (sessionStorage.getItem("fpl.reloadedFor") === b) return;
        sessionStorage.setItem("fpl.reloadedFor", b);
        location.reload();
      } catch (e) {}
    }
    // Gameweek the fixture strip belongs to (its own payload), so a match always opens in the right GW.
    function stripGameweek() {
      const src = state.league || state.entry;
      return (src && src.gameweek) || (state.scoreboard && state.scoreboard.gameweek) || state.gameweek || null;
    }
    function renderFixtures(fixtures) {
      const box = el("<section class='card' id='fxStrip'><div class='muted'>Gameweek fixtures <span class='mc-dot fx-dot' title='Live scores'></span><span class='mc-src espn fx-src'" +
        (state.scoreboard && state.scoreboard.source === "ESPN" ? "" : " hidden") + ">scores: ESPN</span></div><div class='fixtures'></div></section>");
      const row = box.querySelector(".fixtures");
      fixtures.forEach((fxRaw) => {
        // Live score/clock from the ESPN-backed scoreboard when available (FPL fallback).
        const sbf = freshestScore(fxRaw);
        const fx = sbf ? Object.assign({}, fxRaw, {
          homeScore: sbf.homeScore, awayScore: sbf.awayScore, started: sbf.started, finished: sbf.finished, clock: sbf.clock, state: sbf.state
        }) : fxRaw;
        const score = fx.started || fx.finished
          ? (fmt(fx.homeScore) + "–" + fmt(fx.awayScore))
          : "vs";
        const clock = fxClock(fx);
        const node = el("<div class='fx tap' role='button' tabindex='0' data-fx='" + fx.id + "'><div>" + escapeHtml(fx.home) + " <span class='score'>" + score +
          "</span> " + escapeHtml(fx.away) + "</div><div class='muted'><span class='clk'>" + escapeHtml(clock) + "</span> · <span class='fx-open'>Match ›</span></div></div>");
        node.addEventListener("click", () => openMatch(fx.id, stripGameweek()));
        node.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openMatch(fx.id, stripGameweek()); } });
        if (fx.started && !fx.finished) node.classList.add("live");
        if (fx.finished) node.classList.add("done");
        const sbRow = scoreboardFor(fx.id);
        paintLineupTag(node, !!(sbRow && sbRow.lineups && !fx.started));
        const mine = playersInFixture(fx);
        if (mine.length) {
          const list = el("<div class='fx-players'></div>");
          mine.forEach((pl) => {
            const role = pl.captain ? "C" : (pl.viceCaptain ? "VC" : "");
            const bits = [escapeHtml(pl.webName || pl.name || "")];
            if (role) bits.push("<span class='role'>" + role + "</span>");
            if (pl.onBench) bits.push("<span class='muted'>bench</span>");
            bits.push("<span class='muted'>" + fmt(pl.minutes) + "'</span>");
            bits.push("<span class='pts'>" + fmt(pl.contribution) + " pts</span>");
            const pr = priceHtml(pl);
            if (pr) bits.push(pr);
            list.appendChild(el("<div" + (pl.onBench ? " class='bench'" : "") + ">" + bits.join(" · ") + "</div>"));
          });
          node.appendChild(list);
        }
        row.appendChild(node);
      });
      return box;
    }


    function scorerLine(team) {
      const players = (team.players || []).filter((pl) => !pl.onBench && (pl.contribution > 0 || pl.minutes > 0));
      const scored = players.filter((pl) => pl.contribution > 0)
        .sort((a, b) => (b.contribution - a.contribution));
      if (!scored.length) {
        return "<div class='scorers zero'>No points yet</div>";
      }
      const bits = scored.map((pl) => {
        const tag = pl.captain ? " C" : (pl.viceCaptain ? " VC" : "");
        const pr = pricePlain(pl);
        return escapeHtml(pl.webName || pl.name) + tag + (pr ? (" " + pr) : "") + " <b>" + pl.contribution + "</b>";
      });
      return "<div class='scorers'>" + bits.join(" · ") + "</div>";
    }

    function renderTable() {
      const lg = state.league;
      const wrap = el("<section class='card league-board'></section>");

      const bar = el("<div class='league-toolbar'></div>");
      const left = el("<div><strong>" + escapeHtml(lg.leagueName || ("League " + lg.leagueId)) +
        "</strong> <span class='muted'>· " + (lg.shown || 0) + (lg.entryCount ? ("/" + lg.entryCount) : "") + " teams</span></div>");
      const controls = el("<div style='display:flex;gap:0.35rem;flex-wrap:wrap;align-items:center'></div>");
      const auto = el("<button type='button'>Autosubs " + (state.autosubs ? "On" : "Off") + "</button>");
      auto.classList.toggle("active", !!state.autosubs);
      auto.onclick = () => { state.autosubs = !state.autosubs; if (lg) loadLeague(lg.leagueId); else if (state.entryId) loadEntry(state.entryId); };
      controls.appendChild(auto);
      bar.appendChild(left);
      bar.appendChild(controls);
      wrap.appendChild(bar);

      if (lg.capNote) wrap.appendChild(el("<p class='note'>" + escapeHtml(lg.capNote) + "</p>"));
      if (!lg.live) wrap.appendChild(el("<p class='muted' style='text-align:center'>GW not started yet — showing official FPL totals (live columns will move after kickoff).</p>"));

      const title = (lg.leagueName || ("League " + lg.leagueId)) + " — Live Gameweek " + fmt(lg.gameweek || state.gameweek) + " Table";
      wrap.appendChild(el("<div class='league-title'>" + escapeHtml(title) + "</div>"));
      wrap.appendChild(el("<div class='league-cols'><span class='c-pos'>Pos</span><span class='c-mgr'>Manager</span><span class='c-yet'>Yet</span><span class='c-cap'>(C)</span><span class='c-gw'>GW</span><span class='c-total'>Total</span><span class='c-chev'></span></div>"));

      const rows = (lg.teams || []).slice().sort((a, b) => {
        const k = state.sort.key;
        const av = a[k], bv = b[k];
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        if (typeof av === "string") return av.localeCompare(bv) * state.sort.dir;
        return (av - bv) * (k === "liveRank" || k === "officialRank" || k === "overallRank" || k === "liveOverallRankEstimate" ? (state.sort.dir === 1 ? 1 : -1) : state.sort.dir);
      });

      const list = el("<div class='league-cards'></div>");
      rows.forEach((team) => {
        const selected = !!(state.picks && state.picks.entryId === team.entryId);
        const expanded = state.expandedEntry === team.entryId;
        const caps = captainPair(team);
        const hit = Number(team.transferCost || 0);
        const pills = [];
        if (team.activeChip) pills.push("<span class='mini-pill chip'>" + escapeHtml(team.activeChip) + "</span>");
        const nTr = Number(team.eventTransfers) || 0;
        if (nTr > 0) pills.push("<span class='mini-pill tr' title='" + nTr + " transfer" + (nTr === 1 ? "" : "s") + " this GW'>" + nTr + "T</span>");
        if (team.overallRank != null) pills.push("<span class='mini-pill'><b>OR</b> " + fmtRank(team.overallRank) + "</span>");
        const pillRow = pills.length ? ("<div class='lf-pills'>" + pills.join("") + "</div>") : "";

        const card = el(
          "<article class='lf-card" + (selected || expanded ? " selected" : "") + (expanded ? " expanded" : "") + "'>" +
            "<div class='lf-row'>" +
              rankPillHtml(team) +
              "<div class='lf-mgr'>" +
                "<div class='team'>" + escapeHtml(team.entryName || "") + "</div>" +
                "<div class='name'>" + escapeHtml(team.managerName || "") + "</div>" +
                pillRow +
              "</div>" +
              "<div class='lf-yet'>" + fmt(team.playersRemaining) + "</div>" +
              "<div class='lf-cap'>" +
                "<span class='c-name'>" + escapeHtml(caps.captain || "—") + "</span>" +
                (caps.vice ? ("<span class='vc-name'>" + escapeHtml(caps.vice) + "</span>") : "") +
              "</div>" +
              "<div class='lf-gw'>" + fmt(team.gwNet) +
                (hit > 0 ? ("<span class='hit'>-" + hit + " hit</span>") : "") +
              "</div>" +
              "<div class='lf-total'>" + fmt(team.liveTotal) + "</div>" +
              "<div class='lf-chevron'>›</div>" +
            "</div>" +
            "<div class='lf-detail'></div>" +
          "</article>"
        );

        // Compact board; tapping a team expands its detail (squad tiles / scorer pills) in place,
        // tapping again collapses it. Wide screens also load the full picks table beside the board.
        if (expanded) card.querySelector(".lf-detail").innerHTML = buildLeagueDetail(team);
        card.onclick = () => {
          if (state.expandedEntry === team.entryId) {
            state.expandedEntry = null;
            render();
            return;
          }
          state.expandedEntry = team.entryId;
          render();
          if (window.matchMedia("(min-width: 1100px)").matches) loadPicks(team);
        };
        list.appendChild(card);
      });
      wrap.appendChild(list);
      return wrap;
    }

    function buildLeagueDetail(team) {
      const meta = [];
      if (team.freeTransfers != null) meta.push("<span class='mini-pill'><b>FT</b> " + fmt(team.freeTransfers) + "</span>");
      if (team.teamValue != null) meta.push("<span class='mini-pill'><b>TV</b> " + fmtMoney(team.teamValue) + "</span>");
      const played = playedCount(team);
      if (played) meta.push("<span class='mini-pill'><b>PLAYED</b> " + played.played + "/" + played.total + "</span>");
      if (team.liveOverallRankEstimate != null) {
        meta.push("<span class='mini-pill'>Live OR " + fmtRank(team.liveOverallRankEstimate) + " est</span>");
      }
      const metaHtml = (meta.length ? ("<div class='lf-meta'>" + meta.join("") + "</div>") : "") + movesHtml(team);

      const players = team.players || [];
      if (!players.length) {
        return metaHtml + scorerPills(team);
      }
      const xi = players.filter((p) => !p.onBench);
      const bench = players.filter((p) => p.onBench);
      function plCell(pl) {
        const pts = Number(pl.contribution) || 0;
        let cls = "zero";
        if (pts >= 8) cls = "hi";
        else if (pts >= 3) cls = "mid";
        else if (pts > 0) cls = "lo";
        const tag = pl.captain ? "C" : (pl.viceCaptain ? "VC" : "");
        const sub = pl.autoSubIn ? " IN" : (pl.autoSubOut ? " OUT" : "");
        const ctx = "league:" + team.entryId;
        return "<div class='lf-pl" + (pl.onBench ? " bench" : "") + (bdIsOpen(ctx, pl.element) ? " bd-open" : "") + "'" + bdAttrs(ctx, pl.element, pl.multiplier) + ">" +
          "<div class='pn'>" + escapeHtml(pl.webName || pl.name || "") + "</div>" +
          (tag || sub ? ("<div class='tag'>" + tag + sub + "</div>") : "") +
          "<div class='pp " + cls + "'>" + pts + "</div></div>";
      }
      const bdCtx = "league:" + team.entryId;
      const bdHere = state.bd && state.bd.ctx === bdCtx && players.some((pl) => pl.element === state.bd.id);
      return metaHtml +
        "<div class='lf-squad'>" + xi.map(plCell).join("") + "</div>" +
        (bench.length ? ("<div class='muted' style='margin:0.35rem 0 0.15rem;font-size:0.7rem;color:#6b7280'>Bench</div><div class='lf-squad'>" + bench.map(plCell).join("") + "</div>") : "") +
        (bdHere ? "<div class='lf-bd'>" + bdPanelHtml(bdCtx, state.bd.id) + "</div>" : "");
    }

    const CHIP_NAMES = { WC: "Wildcard", FH: "Free Hit", BB: "Bench Boost", TC: "Triple Captain", AM: "Assistant Manager" };
    // Transfers made this GW (OUT -> IN, hit, chip) and automatic subs for one mini-league team.
    function movesHtml(team) {
      const n = Number(team.eventTransfers) || 0;
      const hit = Number(team.transferCost) || 0;
      const chip = team.activeChip || "";
      const chipName = CHIP_NAMES[chip] || chip;
      const unlimited = chip === "WC" || chip === "FH";
      const head = ["<span>" + (n ? (n + " transfer" + (n === 1 ? "" : "s")) : "No transfers") + "</span>"];
      if (hit > 0) head.push("<span class='mv-hit'>-" + hit + " hit</span>");
      else if (n > 0) head.push("<span class='mv-free'>" + (unlimited ? "no hit (" + escapeHtml(chipName) + ")" : "no hit") + "</span>");
      if (chip) head.push("<span class='mini-pill chip' title='" + escapeHtml(chipName) + "'>" + escapeHtml(chip) + "</span>" +
        (unlimited ? "" : "<span class='mv-free'>" + escapeHtml(chipName) + "</span>"));
      const tr = team.transfers || [];
      const trList = tr.length
        ? "<ul class='mv-transfers'>" + tr.map((t) =>
            "<li><span class='mv-out'>" + escapeHtml(t.outName) + "</span>" + (t.outTeam ? " <span class='mv-team'>" + escapeHtml(t.outTeam) + "</span>" : "") +
            " → <span class='mv-in'>" + escapeHtml(t.inName) + "</span>" + (t.inTeam ? " <span class='mv-team'>" + escapeHtml(t.inTeam) + "</span>" : "") + "</li>").join("") + "</ul>"
        : (n > 0 ? "<div class='mv-note'>" + (team.transfersListed === false ? "Transfer list unavailable right now (FPL slow)." : "Transfer list not available yet.") + "</div>" : "");
      const subs = team.autoSubs || [];
      const anyProv = subs.some((x) => x.provisional);
      const subsHtml = subs.length
        ? "<div class='mv-head'><span>Autosubs " + subs.length + "</span>" + (anyProv ? "<span class='mv-free'>live, until FPL confirms</span>" : "") + "</div>" +
          "<ul class='mv-subs'>" + subs.map((x) =>
            "<li><span class='mv-in'>" + escapeHtml(x.inName) + "</span> came on for <span class='mv-out'>" + escapeHtml(x.outName) + "</span>" +
            (x.provisional ? "<span class='mv-prov'>provisional</span>" : "") + "</li>").join("") + "</ul>"
        : "";
      return "<div class='lf-moves'><div class='mv-head'>" + head.join("") + "</div>" + trList + subsHtml + "</div>";
    }

    function scorerPills(team) {
      const players = (team.players || []).filter((pl) => !pl.onBench && (pl.contribution > 0 || pl.minutes > 0));
      const scored = players.filter((pl) => pl.contribution > 0)
        .sort((a, b) => (b.contribution - a.contribution));
      if (!scored.length) {
        return "<div class='scorer-pills'><span class='scorer-pill zero'>No points yet</span></div>";
      }
      const pills = scored.map((pl) => {
        const tag = pl.captain ? " C" : (pl.viceCaptain ? " VC" : "");
        const pts = Number(pl.contribution) || 0;
        const cls = pts >= 8 ? " hi" : (pts <= 1 ? " lo" : "");
        const pr = priceHtml(pl);
        return "<span class='scorer-pill" + cls + "'>" + escapeHtml(pl.webName || pl.name) + tag + (pr ? (" " + pr) : "") + " <b>" + pl.contribution + "</b></span>";
      });
      return "<div class='scorer-pills'>" + pills.join("") + "</div>";
    }

    // ---------- player points breakdown (tap to open, tap again to close) ----------
    const BD_REFRESH_MS = 15000;
    function bdIsOpen(ctx, id) { return !!(state.bd && state.bd.ctx === ctx && state.bd.id === id); }
    function bdAttrs(ctx, id, mult) {
      return " data-bd-ctx='" + escapeHtml(ctx) + "' data-bd-id='" + Number(id) + "' data-bd-mult='" + (Number(mult) || 1) +
        "' role='button' tabindex='0' aria-expanded='" + (bdIsOpen(ctx, id) ? "true" : "false") + "'";
    }
    function bdGw() { return (state.board && state.board.gameweek) || state.gameweek || null; }
    function bdPts(n) {
      const v = Number(n) || 0;
      return "<span class='" + (v > 0 ? "pos" : (v < 0 ? "neg" : "zero")) + "'>" + (v > 0 ? "+" + v : String(v)) + "</span>";
    }
    function bdPanelHtml(ctx, id) {
      const entry = (state.bdCache || {})[id];
      let inner;
      if (!entry || (entry.loading && !entry.data)) inner = "<p class='muted'>Loading points breakdown…</p>";
      else if (entry.error && !entry.data) inner = "<p class='error'>" + escapeHtml(entry.error) + "</p><button type='button' class='bd-retry'>Retry</button>";
      else inner = bdTableHtml(entry.data, state.bd && state.bd.mult);
      return "<div class='bd-panel' data-bd-panel='" + escapeHtml(ctx) + "|" + Number(id) + "'>" + inner + "</div>";
    }
    function bdTableHtml(d, mult) {
      const fxs = d.fixtures || [];
      let rows = "";
      if (!fxs.length) rows = "<tr><td colspan='3' class='muted'>No fixture this gameweek.</td></tr>";
      fxs.forEach((f) => {
        if (fxs.length > 1 || f.score || !f.started) {
          rows += "<tr class='fx'><td colspan='3'>vs " + escapeHtml(f.opponent) + (f.score ? " · " + escapeHtml(f.score) : "") +
            (!f.started ? " · not started" : (f.finished ? " · FT" : " · live")) + "</td></tr>";
        }
        (f.stats || []).forEach((st) => {
          if (st.identifier === "bonus") return;
          rows += "<tr><td>" + escapeHtml(st.label) + "</td><td class='n'>" + fmt(st.value) + "</td><td class='n'>" + bdPts(st.points) + "</td></tr>";
        });
        if (f.bonus > 0 || f.bps != null) {
          const tag = f.bonusStatus && f.bonusStatus !== "none" ? "<span class='bd-tag " + f.bonusStatus + "'>" + f.bonusStatus + "</span>" : "";
          rows += "<tr><td>Bonus" + tag + (f.bps != null ? " <span class='muted'>· BPS " + fmt(f.bps) + "</span>" : "") +
            "</td><td class='n'>" + fmt(f.bonus) + "</td><td class='n'>" + bdPts(f.bonus) + "</td></tr>";
        }
      });
      rows += "<tr class='tot'><td>Total</td><td class='n'></td><td class='n'>" + fmt(d.officialTotal) + "</td></tr>";
      if (d.projectedBonus > 0) {
        rows += "<tr class='tot'><td>With projected bonus<span class='bd-tag projected'>projected</span></td><td class='n'></td><td class='n'>" + fmt(d.liveTotal) + "</td></tr>";
      }
      const m = Number(mult) || 1;
      if (m > 1) rows += "<tr class='tot'><td>× " + m + (m === 3 ? " (triple captain)" : " (captain)") + "</td><td class='n'></td><td class='n'>" + fmt(d.liveTotal * m) + "</td></tr>";
      return "<div class='bd-head'><span>" + escapeHtml(d.webName) + " <span class='muted'>" + escapeHtml(d.team) + " · " + escapeHtml(d.position) +
        "</span></span><span class='muted'>GW" + d.gameweek + (d.bps != null ? " · BPS " + fmt(d.bps) : "") + "</span></div>" +
        "<table class='bd'><colgroup><col class='lab'><col class='n'><col class='n'></colgroup><thead><tr><th>Stat</th><th class='n'>Value</th><th class='n'>Pts</th></tr></thead><tbody>" +
        rows + "</tbody></table>" +
        (d.projectedBonus > 0 ? "<div class='bd-foot'>Projected bonus is estimated from live BPS and not yet in FPL's total.</div>" : "");
    }
    async function bdFetch(id, quiet) {
      state.bdCache = state.bdCache || {};
      const entry = state.bdCache[id] || (state.bdCache[id] = {});
      entry.loading = true;
      if (!quiet) entry.error = null;
      try {
        const gw = bdGw();
        const data = await api("/players/" + id + "/breakdown" + (gw ? "?gameweek=" + gw : ""));
        entry.data = data; entry.error = null; entry.at = Date.now();
      } catch (err) {
        entry.error = err.message;
        if (!quiet) entry.data = null;
      }
      entry.loading = false;
      bdPaint();
    }
    // Repaint open panels in place (no full re-render, so board scroll / card state are kept).
    function bdPaint() {
      if (!state.bd) return;
      document.querySelectorAll("[data-bd-panel]").forEach((node) => {
        const [ctx, id] = node.getAttribute("data-bd-panel").split("|");
        if (ctx === state.bd.ctx && Number(id) === state.bd.id) node.outerHTML = bdPanelHtml(ctx, Number(id));
      });
    }
    function bdToggle(ctx, id, mult) {
      if (bdIsOpen(ctx, id)) state.bd = null;
      else {
        state.bd = { ctx: ctx, id: id, mult: mult };
        const cached = (state.bdCache || {})[id];
        if (!cached || !cached.data || Date.now() - (cached.at || 0) > BD_REFRESH_MS) bdFetch(id, !!(cached && cached.data));
      }
      if (ctx === "board") renderBoard(); else render();
    }
    // Live updates: refresh the open breakdown whenever the board / entry / league data refreshes.
    function bdRefresh() {
      if (!state.bd) return;
      const c = (state.bdCache || {})[state.bd.id];
      if (c && c.loading) return;
      if (!c || Date.now() - (c.at || 0) >= BD_REFRESH_MS) bdFetch(state.bd.id, true);
    }
    // Capture phase so a tap on a squad tile / panel never reaches the league card's expand toggle.
    document.addEventListener("click", (ev) => {
      const t = ev.target;
      if (!t || !t.closest) return;
      const retry = t.closest(".bd-retry");
      if (retry && state.bd) { ev.stopPropagation(); bdFetch(state.bd.id, false); bdPaint(); return; }
      if (t.closest(".bd-panel")) { ev.stopPropagation(); return; }
      const hit = t.closest("[data-bd-id]");
      if (!hit) return;
      ev.stopPropagation();
      bdToggle(hit.getAttribute("data-bd-ctx"), Number(hit.getAttribute("data-bd-id")), Number(hit.getAttribute("data-bd-mult")) || 1);
    }, true);
    document.addEventListener("keydown", (ev) => {
      if (ev.key !== "Enter" && ev.key !== " ") return;
      const hit = ev.target && ev.target.closest && ev.target.closest("[data-bd-id]");
      if (!hit || hit !== ev.target) return;
      ev.preventDefault(); ev.stopPropagation();
      bdToggle(hit.getAttribute("data-bd-ctx"), Number(hit.getAttribute("data-bd-id")), Number(hit.getAttribute("data-bd-mult")) || 1);
    }, true);

    function renderPicks() {
      const p = state.picks;
      const box = el("<section class='card'></section>");
      if (p.error) {
        box.appendChild(el("<p class='error'>" + escapeHtml(p.error) + "</p>"));
        return box;
      }
      box.appendChild(el("<div><strong>" + escapeHtml(p.managerName || "") + "</strong> · " +
        escapeHtml(p.entryName || p.teamName || "") + "</div>"));
      box.appendChild(el("<p class='muted'>GW net " + fmt(p.gwNet) + " · gross " + fmt(p.gwGross) +
        " · hit " + fmt(p.transferCost) + " · live total " + fmt(p.liveTotal) +
        (p.activeChip ? (" · " + p.activeChip) : "") + "</p>"));
      const wrap = el("<div class='picks-wrap'></div>");
      const table = el("<table class='live players'><thead><tr>" +
        "<th></th><th>Player</th><th class='num'>Price</th><th class='num'>Min</th><th class='num'>Raw</th><th class='num'>Bonus</th><th class='num'>×</th><th class='num'>EO</th><th class='num'>Pts</th>" +
        "</tr></thead><tbody></tbody></table>");
      const tbody = table.querySelector("tbody");
      (p.players || []).forEach((pl) => {
        const tag = pl.captain ? " C" : (pl.viceCaptain ? " VC" : "");

    // ---------- player search (client-side, accent-insensitive) ----------
    const SEARCH_FOLD = { "ø": "o", "æ": "ae", "œ": "oe", "ß": "ss", "ł": "l", "đ": "d", "ð": "d", "þ": "th", "ı": "i", "ħ": "h" };
    function foldText(v) {
      return String(v || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[øæœßłđðþıħ]/g, (c) => SEARCH_FOLD[c] || c).replace(/[^a-z0-9]+/g, " ").trim();

    let searchIndexFor = null, searchIndex = null;
    function boardSearchIndex() {
      const players = (state.board && state.board.players) || [];
      if (searchIndexFor === players && searchIndex) return searchIndex;
      searchIndex = new Map();
      players.forEach((p) => {
        const name = foldText(p.webName), full = foldText(p.fullName || "");
        searchIndex.set(p.id, { name: name, words: (name + " " + full).split(" ").filter(Boolean), hay: " " + name + " " + full + " ", team: foldText(p.team) });
      });

    // 0 = exact web name, 1 = web name starts with query, 2 = team code, 3 = a name word starts with it, 4 = substring; -1 = no match.
    function searchRank(p, q) {
      const ix = boardSearchIndex().get(p.id) || { name: foldText(p.webName), words: foldText(p.webName).split(" "), hay: " " + foldText(p.webName) + " ", team: foldText(p.team) };
      if (ix.name === q) return 0;
      if (ix.name.startsWith(q)) return 1;
      if (ix.team === q) return 2;
      if (ix.hay.includes(" " + q)) return 3;
      if (ix.hay.includes(q)) return 4;
      return -1;
    }

      rows.forEach((p, i) => { const r = searchRank(p, q); if (r >= 0) out.push([r, i, p]); });
      out.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      return out.map((x) => x[2]);

            "<span class='nm'>" + escapeHtml(p.player) + cap + sub + " " + icons + "</span>" +
            "<span class='min'>" + p.minutes + "'</span><span class='pts'>" + p.points + bonus + "</span></div>"));
        });
        card.appendChild(sec);
      });
      return card;
    }
    function renderMatchStats(m) {
      const card = el("<section class='card'></section>");
      card.appendChild(el("<p class='mc-note'>" + (m.source === "ESPN" ? "Possession, shots and other match stats from ESPN; xG, BPS and FPL totals from the official FPL API." : "Team totals from FPL match stats. FPL has no possession or shot data.") + "</p>"));
      const head = el("<div class='mc-stat'><div class='row'><span class='hv'>" + crest(m.home, 22) + "</span><span class='lbl'></span><span class='av'>" + crest(m.away, 22) + "</span></div></div>");
      card.appendChild(head);
      let lastSrc = null;
      m.stats.forEach((s) => {
        if (m.source === "ESPN" && s.source !== lastSrc) {
          card.appendChild(el("<div class='mc-subhead'>" + (s.source === "ESPN" ? "Match stats (ESPN)" : "FPL stats") + "</div>"));
          lastSrc = s.source;
        }
        const h = parseFloat(s.home) || 0, a = parseFloat(s.away) || 0;
        const tot = Math.abs(h) + Math.abs(a);
        const hp = tot ? Math.round(Math.abs(h) / tot * 100) : 50;
        card.appendChild(el("<div class='mc-stat'><div class='row'><span class='hv'>" + escapeHtml(s.home) + "</span><span class='lbl'>" + escapeHtml(s.label) +
          "</span><span class='av'>" + escapeHtml(s.away) + "</span></div><div class='mc-bar" + (tot ? "" : " empty") + "'><span class='bh' style='flex:" + hp + "'></span><span class='ba' style='flex:" + (100 - hp) + "'></span></div></div>"));
      });
      return card;
    }
    (function openMatchFromHash() {
      const m = /^#match-(\d+)$/.exec(location.hash);
      if (m) setTimeout(() => openMatch(Number(m[1])), 0);
    })();
  </script>
</body>
</html>
